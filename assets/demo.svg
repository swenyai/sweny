<text class="t" x="401" y="23" text-anchor="middle">sweny try</text>
<text class="r k0" x="24" y="69" xml:space="preserve"><tspan x="24.00" class="c0">$</tspan><tspan x="39.70" class="b">sweny try</tspan></text>
<text class="r k1" x="24" y="88" xml:space="preserve"><tspan x="39.70" class="c1">▲</tspan><tspan x="55.40" class="b">SWEny</tspan><tspan x="110.35">Workflows for coding agents. One set of rules, a receipt for every run.</tspan></text>
<text class="r k2" x="24" y="107" xml:space="preserve"><tspan x="39.70" class="c0">Recorded demo of explain-repo on a sample repo (acme-notes-api), illustrative data. No agent,</tspan></text>
<text class="r k2" x="24" y="126" xml:space="preserve"><tspan x="55.40" class="c0">network or credentials.</tspan></text>
<text class="r k3" x="24" y="145" xml:space="preserve"></text>
<text class="r k4 sp" x="24" y="164" xml:space="preserve"><tspan x="39.70" class="c1">⠸</tspan><tspan x="55.40">survey</tspan></text>
<text class="r k5" x="24" y="164" xml:space="preserve"><tspan x="39.70" class="c2">✓</tspan><tspan x="55.40">survey</tspan><tspan x="126.05" class="c0">18s · 12 tool calls</tspan></text>
<text class="r k6 sp" x="24" y="183" xml:space="preserve"><tspan x="39.70" class="c1">⠸</tspan><tspan x="55.40">explain</tspan></text>
<text class="r k7" x="24" y="183" xml:space="preserve"><tspan x="39.70" class="c2">✓</tspan><tspan x="55.40">explain</tspan><tspan x="126.05" class="c0">9s</tspan></text>
<text class="r k8" x="24" y="202" xml:space="preserve"></text>
<text class="r k9" x="24" y="221" xml:space="preserve"><tspan x="39.70">What it is: A small REST API for storing and searching notes, built with Express and</tspan></text>
<text class="r k9" x="24" y="240" xml:space="preserve"><tspan x="55.40">TypeScript on top of SQLite. Meant as the backend for a notes app.</tspan></text>
<text class="r k10" x="24" y="259" xml:space="preserve"><tspan x="39.70">How to run it:</tspan></text>
<text class="r k11" x="24" y="278" xml:space="preserve"><tspan x="39.70">- npm install</tspan></text>
<text class="r k12" x="24" y="297" xml:space="preserve"><tspan x="39.70">- npm run build</tspan></text>
<text class="r k13" x="24" y="316" xml:space="preserve"><tspan x="39.70">- npm test</tspan></text>
<text class="r k14" x="24" y="335" xml:space="preserve"><tspan x="39.70">- npm start (serves on http://localhost:3000)</tspan></text>
<text class="r k15" x="24" y="354" xml:space="preserve"><tspan x="39.70">Key files:</tspan></text>
<text class="r k16" x="24" y="373" xml:space="preserve"><tspan x="39.70">- src/server.ts: the entry point, wires routes and the database</tspan></text>
<text class="r k17" x="24" y="392" xml:space="preserve"><tspan x="39.70">- src/routes/notes.ts: the CRUD and search endpoints</tspan></text>
<text class="r k18" x="24" y="411" xml:space="preserve"><tspan x="39.70">- src/db/schema.sql: the tables, applied on first start</tspan></text>
<text class="r k19" x="24" y="430" xml:space="preserve"><tspan x="39.70">- test/notes.test.ts: the API tests, a good map of expected behavior</tspan></text>
<text class="r k20" x="24" y="449" xml:space="preserve"><tspan x="39.70">Watch out for:</tspan></text>
<text class="r k21" x="24" y="468" xml:space="preserve"><tspan x="39.70">- No auth on any route: fine locally, not safe to expose as is.</tspan></text>
<text class="r k22" x="24" y="487" xml:space="preserve"><tspan x="39.70">- The README does not mention the PORT or DB_PATH environment variables that src/server.ts</tspan></text>
<text class="r k22" x="24" y="506" xml:space="preserve"><tspan x="55.40">reads.</tspan></text>
<text class="r k23" x="24" y="525" xml:space="preserve"></text>
<text class="r k24" x="24" y="544" xml:space="preserve"><tspan x="39.70" class="c0">╭┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄╮</tspan></text>
<text class="r k25" x="24" y="563" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c2 b">✓ passed</tspan><tspan x="338.00" class="c0">run demo</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k26" x="24" y="582" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40">explain-repo</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k27" x="24" y="601" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k28" x="24" y="620" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">nodes</tspan><tspan x="149.60">2/2</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k29" x="24" y="639" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">tool calls</tspan><tspan x="149.60">12</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k30" x="24" y="658" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">duration</tspan><tspan x="149.60">28s</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k31" x="24" y="677" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">tokens</tspan><tspan x="149.60">30k</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k32" x="24" y="696" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">cost</tspan><tspan x="149.60">$0.13</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k33" x="24" y="715" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">policy</tspan><tspan x="149.60">env scoped, sandbox on</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k34" x="24" y="734" xml:space="preserve"><tspan x="39.70" class="c0">├╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┤</tspan></text>
<text class="r k35" x="24" y="753" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="126.05" class="c1 b">[ ENV SCOPED · SANDBOXED ]</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k36" x="24" y="772" xml:space="preserve"><tspan x="39.70" class="c0">╰┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄╯</tspan></text>
<text class="r k37" x="24" y="791" xml:space="preserve"></text>
<text class="r k38" x="24" y="810" xml:space="preserve"><tspan x="39.70" class="c0">Run it on your repo:</tspan><tspan x="212.40" class="b">npx @sweny-ai/core new --template explain-repo</tspan></text>
