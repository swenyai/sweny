id: triage
name: Alert Triage
workflow_type: monitor
description: Investigate a production alert, determine root cause, create an issue, implement a fix, and notify the team
entry: gather
# Ceiling (#365). `write` because implement and create_pr change code in the
# checkout and push a branch; every other node narrows to `read`. External
# writes (issues, comments, the PR) happen only as declared outputs, applied
# by sweny after the node, within these types and this run-wide cap.
permissions: write
safe_outputs:
  allow: [issue, comment, issue_state, pr]
  max: 25
nodes:
  gather:
    name: Gather Context
    instruction: >-
      You are investigating a production alert. Gather all relevant context using the available tools:


      1. **Observability**: Pull error details, stack traces, recent logs, metrics, and active incidents around the time
      of the alert. Use whichever observability tools are available to you.

      2. **Source control**: Check recent commits, pull requests, and deploys that might be related.

      3. **Issue tracker**: Search for similar past issues or known problems.


      Be thorough, but stay in scope: read, search, and summarize. The investigation step depends on
      complete context, not on fixes.


      **Scope boundary (this node is READ-ONLY):**

      - DO NOT create issues, comments, branches, commits, or pull requests, and DO NOT implement
      fixes. Downstream nodes (`create_issue`, `implement`, `create_pr`) handle ALL writes.

      - Your ONLY job is to collect context and report it, then stop. Doing downstream work here
      burns your turn budget and duplicates what later nodes will do.
    skills:
      - github
      - sentry
      - datadog
      - betterstack
      - linear
    # Structural enforcement of the read-only scope above (#365): `read`
    # registers only read skill tools, withholds external MCP servers, and
    # removes every write-capable built-in (shell, file edits, subagents), on
    # every harness. Driving incident: the 2026-06-08
    # letsoffload/permit-service scheduled run, where gather created Linear
    # issues OFF-2332/OFF-2333 and PRs #101/#102 from inside this node, and
    # authored code changes, then died at the 50-turn cap.
    permissions: read
    # When gather still dies early (turn cap, SDK error), proceed with the
    # partial context instead of failing the whole workflow: investigate has
    # its own tools and can re-derive what gather missed. The 2026-06-08 run
    # proved this empirically: after gather "failed", investigate completed
    # fine and produced a correct no-novel-issues verdict.
    fail_soft: true
  investigate:
    name: Root Cause Analysis
    instruction: >-
      Based on the gathered context, classify every distinct issue you found into one of two buckets: **novel** or
      **duplicate**.


      For EACH issue found:

      1. Identify the root cause and affected code/service.

      2. Assess severity: critical (service down), high (major feature broken), medium (degraded), low (cosmetic/minor).

      3. Assess fix complexity: "simple" (a few lines, clear change), "moderate" (multiple files but well-understood),
      or "complex" (architectural, risky, or unclear).

      4. **Novelty check (REQUIRED — you MUST call tools for this step):** Filing a duplicate ticket is worse
      than under-reporting — the team inherits sprawl that humans have to clean up later. Complete EVERY step
      below before classifying anything as novel. Do NOT skip these searches even if the gather context already
      mentions existing issues or branches — you must verify independently.

      4a. **Search broadly — THIS REQUIRES TOOL CALLS.** You MUST call `linear_search_issues` (or
      `github_search_issues`) with multiple queries against the issue tracker (BOTH open AND closed): the
      affected file or module path, the error message or log string verbatim, the feature or service name,
      and the symptom family (e.g. "startup crash", "data dropped silently"). Do not rely on a single
      keyword — a narrow search is how duplicates slip through. If you skip this search, the eval check
      will fail.

      4b. **Read the full body of every promising candidate — do NOT match on title alone.** For each top match,
      open the issue and read its entire description, including any "Recommended Fix", "Proposed Fix", "Action
      Items", or "Acceptance Criteria" section. An existing open issue whose recommended fix already prescribes
      the change you were about to propose IS a duplicate, even if the symptom you just observed is a new
      instance of the same underlying bug.

      4c. **Check for meta-issues and bug families.** If an existing ticket names a pattern that your finding is
      another instance of (same root cause, same function/module, different input or caller), treat your finding
      as a sibling of that family and comment on the existing ticket. Do not file a parallel ticket per instance
      — that is the exact pattern that produces backlog sprawl.

      4d. **When uncertain, comment don't file.** If you are less than ~80% confident a finding is truly novel
      after steps 4a–4c, classify it as a duplicate and add a "+1 — another instance" comment to the closest
      existing issue with the new context. Over-reporting duplicates is cheap; ticket sprawl is expensive.

         - If matched → **duplicate**. Record the existing issue ID in `duplicate_of`.
         - If no match after 4a–4d → **novel**.

      **Output rules:**

      - `findings`: array of ALL issues found (both novel and duplicate).

      - `novel_count`: how many findings are novel (not duplicates).

      - `fixable_count`: how many NOVEL findings have `fix_complexity` simple or moderate AND a non-empty
      `fix_approach`. 0 when none do. This decides whether sweny attempts a fix after filing the issue.

      - `highest_severity`: the highest severity across ALL findings.

      - `recommendation`: what should happen next.


      Downstream nodes will act ONLY on novel findings. Duplicates will be +1'd automatically.


      **IMPORTANT — scope boundaries for this node:**

      - DO NOT create issues (Linear, GitHub, or any tracker). A downstream `create_issue` node handles that.

      - DO NOT create branches, commits, or pull requests. A downstream `implement` node handles that.

      - DO NOT call any write tools (`linear_create_issue`, `github_create_issue`,
      `github_create_pr`, `linear_add_comment`, `github_add_comment`, etc.).
      Downstream nodes handle all writes — issue creation, +1 comments, and PRs.

      - Your ONLY job is read, search, classify, and output. If you create an issue
      or add a comment here, the downstream eval check will fail or duplicate work.
    skills:
      - github
      - linear
    # Structural enforcement of the scope boundaries above (#365): the node
    # is read-only, so no write tool or write-capable built-in reaches it.
    permissions: read
    eval:
      # The novelty check REQUIRES searching the issue tracker. If the node finishes
      # with 0 search tool calls, it means the agent skipped the novelty check entirely
      # and any "novel" classification is unreliable.
      - name: novelty_search_was_performed
        kind: function
        rule:
          any_tool_called:
            - linear_search_issues
            - github_search_issues
    output:
      type: object
      properties:
        findings:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: Short description of the issue
              root_cause:
                type: string
              severity:
                type: string
                enum:
                  - critical
                  - high
                  - medium
                  - low
              affected_services:
                type: array
                items:
                  type: string
              is_duplicate:
                type: boolean
              duplicate_of:
                type: string
                description: Existing issue ID/URL if duplicate
              fix_approach:
                type: string
              fix_complexity:
                type: string
                enum:
                  - simple
                  - moderate
                  - complex
            required:
              - title
              - root_cause
              - severity
              - is_duplicate
        novel_count:
          type: number
          description: Count of novel (non-duplicate) findings
        fixable_count:
          type: integer
          minimum: 0
          description: >-
            Count of novel findings whose fix_complexity is simple or moderate AND
            whose fix_approach is a non-empty plan. Routes create_issue to implement.
        highest_severity:
          type: string
          enum:
            - critical
            - high
            - medium
            - low
        recommendation:
          type: string
      required:
        - findings
        - novel_count
        - fixable_count
        - highest_severity
        - recommendation
  create_issue:
    name: Create Issues & Triage Duplicates
    instruction: >-
      Process ALL findings from the investigation. The findings array contains both novel and duplicate issues.


      **How writes work here.** If you have the `emit_output` tool, you cannot write to the tracker directly:
      request each new issue and each comment with `emit_output`, and sweny files them after this step, within
      its limits. A requested issue has no identifier yet; sweny records it for the next steps. Without
      `emit_output`, use the tracker's own tools (for example `linear_create_issue`, `github_create_issue`,
      `linear_add_comment`, `github_add_comment`, or the configured tracker's MCP tools) and copy the
      identifier they return.


      **For each NOVEL finding** (is_duplicate = false):

      1. **First, check if a prior triage run already created an issue for this exact bug.** Call
      `linear_search_issues` (or `github_search_issues`) with the error message or root cause.
      If a matching issue already exists with the same root cause:
         - Treat it as a duplicate: DO NOT create a new issue.
         - Populate `issueIdentifier`, `issueTitle`, and `issueUrl` from the existing issue.
         - Add a "+1" comment if appropriate.
         - Set the `action` to `updated` in the `issues` array.
         - This prevents duplicate tickets when the same alert fires multiple times.

      2. If no matching issue exists, file a new one with a clear, actionable title (type `issue`). Do NOT
      synthesize an identifier from an alert ID, commit SHA, or your own imagination: a new issue's
      identifier comes only from the tracker. Set `dedupe_key` to a short stable fingerprint of the root
      cause, so two findings with the same cause are filed once. Set the `action` to `requested` (or
      `created` when you filed it with a tracker tool and have its identifier).

      3. Include: root cause, severity, affected services, reproduction steps, and recommended fix.

      4. Apply the `sweny`, `agent`, and `triage` labels. For Linear: call `linear_list_labels` to find the
      IDs for labels named `sweny`, `agent`, and `triage`, and pass those IDs as the labels (skip any that
      don't exist in the team; don't invent IDs). For Linear, the target is the team ID (`linear_list_teams`).
      For GitHub: labels `["sweny", "agent", "triage"]`.

      5. Link to relevant commits, PRs, or existing issues.

      6. When you know the identifier (an existing issue, or one a tracker tool returned), copy it verbatim
      into `issueIdentifier`. It must match `^[A-Z][A-Z0-9]*-\d+$` (e.g. `OFF-1234`); do not prefix it with
      anything else. Leave `issueIdentifier` unset for an issue you only requested.


      **For each DUPLICATE finding** (is_duplicate = true):

      1. Find the existing issue (check duplicate_of field).

      2. Check the issue's comments. If the most recent comment is already from SWEny (contains "+1") within
      the last 24 hours, skip adding another comment.

      3. Otherwise add a SHORT comment (type `comment`, `number` = the issue ID or number): "+1 seen again
      {UTC timestamp}. {one sentence of new context}." (Keep it under 2 lines. No markdown headers, no emoji,
      no formatting.)

      4. If the existing issue is closed or done: reopen it (type `issue_state`, `state` = `reopen`, `number`
      = the issue ID or number) when you have `emit_output`; with a tracker tool instead, use one that can
      reopen. If you can do neither, say in the comment that it is closed and was seen again.


      If context.issueTemplate is provided, use it as the format for new issue bodies. Otherwise use a clear structure
      with: Summary, Root Cause, Impact, Steps to Reproduce, and Recommended Fix.


      Use the issue tracker specified in context (e.g. Linear, Jira, or GitHub Issues). Do NOT fall back to a
      different tracker. Output the issues you requested, created, or updated.


      **IMPORTANT: scope boundaries for this node:**

      - DO NOT create branches, commits, or pull requests. The `implement` and `create_pr` nodes handle that.

      - Your job is issue creation and duplicate management ONLY.
    skills:
      - linear
      - github
    # #365: this node reads and decides; it never holds a tracker write.
    # Issues and +1 comments are declared outputs: sweny applies them after
    # the node succeeds (and after its eval), via the configured tracker
    # skill, capped per run and deduped. The node is read-only by default
    # because it declares outputs. The next steps read the new issue's
    # identifier from `context.create_issue.safe_outputs`.
    outputs:
      - type: issue
        max: 10
      - type: comment
        max: 10
      # Reopening a closed duplicate (what triage did before #365). Reopen
      # only: this node never closes an issue. The issue must be named on the
      # request; sweny checks it is in the tracker and only moves a closed one.
      - type: issue_state
        state: reopen
        max: 10
    # Legacy runs (a tracker with no safe-output skill, see
    # cli/builtin-workflows.ts) still never open PRs from here.
    tools:
      deny:
        - github_create_pr
    eval:
      # Require a real issue-tracker action: a search (the duplicate check) or
      # a requested write. emit_output covers safe outputs; the tracker tool
      # names cover a legacy run that writes directly.
      - name: issue_tracker_tool_was_called
        kind: function
        rule:
          any_tool_called:
            - emit_output
            - linear_create_issue
            - github_create_issue
            - linear_search_issues
            - github_search_issues
            - linear_add_comment
            - github_add_comment
    output:
      type: object
      properties:
        issueIdentifier:
          type: string
          pattern: '^[A-Z][A-Z0-9]*-\d+$'
          description: >-
            Primary issue identifier (e.g. OFF-1234) when known in this step: an existing issue the
            duplicate check matched, or one a tracker tool returned. Unset for an issue only requested
            through emit_output; sweny records its identifier in safe_outputs. Never invented from a
            Sentry short-ID or commit SHA.
        issueTitle:
          type: string
          description: Title of the primary issue
        issueUrl:
          type: string
          pattern: "^https?://"
          description: URL of the primary issue, when known in this step
        issues:
          type: array
          minItems: 1
          description: All issues requested, created, or updated during this step
          items:
            type: object
            properties:
              identifier:
                type: string
              title:
                type: string
              url:
                type: string
              action:
                type: string
                enum:
                  - requested
                  - created
                  - updated
                  - reopened
            required:
              - action
      required:
        - issueTitle
        - issues
    retry:
      max: 1
      instruction:
        auto: true
  skip:
    name: Skip - All Duplicates or Low Priority
    instruction: >-
      Every finding from the investigation was either a duplicate or low-priority. No new issues need to be created.


      For each **duplicate** finding (check the findings array for items where is_duplicate = true):

      1. Find the existing issue (check duplicate_of field).

      2. Check the issue's comments. If the most recent comment is already from SWEny (contains "+1") within
      the last 24 hours, skip adding another comment.

      3. Otherwise add a SHORT comment (with `emit_output` type `comment` when you have it, `number` = the
      issue ID or number): "+1 seen again {UTC timestamp}. {one sentence of new context}." (Keep it under 2
      lines. No markdown headers, no emoji, no formatting.)

      4. If the issue is closed or done: reopen it (`emit_output` type `issue_state`, `state` = `reopen`,
      `number` = the issue ID or number) when you have `emit_output`; with a tracker tool instead, use one
      that can reopen. If you can do neither, say in the comment that it is closed and was seen again.


      For **low priority** findings, log a brief note about why they were skipped.
    skills:
      - linear
      - github
    # #365: comments on existing issues, and reopening closed ones, as declared
    # outputs. Read-only otherwise: it never creates issues or PRs.
    outputs:
      - type: comment
        max: 10
      - type: issue_state
        state: reopen
        max: 10
  implement:
    name: Implement Fix
    instruction: |-
      Implement the fix identified during investigation, plus the tests that pin
      it as a regression guard. The issue from the previous step is in your
      context. Use its identifier for branch naming and commit messages.

      **The issue identifier** (ISSUE_ID below): the `ref` of the `issue` entry
      with status `applied` in `context.create_issue.safe_outputs` (the issue
      sweny filed after the previous step), else
      `context.create_issue.issueIdentifier` (an existing issue the previous
      step matched, or one it filed directly).

      ## Quality bar (non-negotiable)

      Every change you make must clear all of these. If you cannot, STOP and
      return a failed status — do not ship a half-measure.

      - **Correctness**: the fix actually closes the failure mode in the issue.
      - **Completeness**: handles the obvious edge cases (nulls, empties, off-by-one,
        concurrent paths). If the issue lists multiple symptoms, address them all
        or explicitly state which are out of scope and why.
      - **Idiomatic for THIS repo, not in general.** Read at least one
        neighboring file in the same module before you write any code, and
        match the patterns you see: error-handling primitives the codebase
        already uses, type discipline, naming, file layout. Examples to make
        the shape concrete:
        - In a NestJS service, throwing `NotFoundException` /
          `BadRequestException` is idiomatic; `throw new Error(...)` is not.
        - In a Go service, returning a wrapped `fmt.Errorf("...: %w", err)`
          beats panicking.
        - In a TypeScript repo, narrow types properly — do not `as any` past
          the type checker.
        These are illustrations. Generalize: whatever the repo already does,
        keep doing.
      - **No hacky shortcuts**: no `try/catch` to swallow errors, no commented-out
        guards, no `// TODO: revisit`, no global flags to bypass validation, no
        copy-pasted bodies. If the right fix needs a small refactor (e.g. extract
        a helper), do it; if it needs a large refactor, file a follow-up issue
        and ship the minimal correct fix without the refactor.
      - **Well-tested**: see Test Requirements below.

      ## Steps

      0. **Precondition: staged preview.** If the `issue` entry in
         `context.create_issue.safe_outputs` has status `staged`, this run is a
         preview (`--stage`) and no issue exists. STOP before touching the
         checkout. Output `test_status: "skipped"`, `skipped_reason: "staged"`,
         empty file lists, `branch: ""`, `commit_sha: ""`.

      0a. **Precondition: verify ISSUE_ID is well-formed.**
         The identifier MUST match `^[A-Z][A-Z0-9]*-\d+$` (e.g. `OFF-1234`). If it
         is missing, empty, or matches a Sentry short-ID / slug / any other shape,
         STOP immediately. Do NOT invent a branch name from the Sentry event,
         commit SHA, or alert payload. Return a failed status with a clear message
         instead; a human will pick it up.

      0b. **Precondition — check for an existing open PR for this issue.** Call
         `github_search_issues` (which hits GitHub's `/search/issues` endpoint
         and returns both issues and PRs) with `type:pr state:open` and the
         issue identifier wrapped in brackets — e.g. query
         `[OFF-1234] in:title type:pr state:open` and pass `repo` for scoping.
         If the response contains one or more PRs whose title starts with
         `[<issueIdentifier>]`, STOP. Do NOT create a branch, commit, or any
         new PR. Output:

         ```
         test_status: "skipped"
         skipped_reason: "open-pr-exists"
         existing_pr_url: "<url of the existing PR>"
         test_files_changed: []
         files_changed: []
         branch: ""
         commit_sha: ""
         ```

         The downstream `create_pr` node will be bypassed and the workflow will
         route to `notify` so the team is told the prior PR is still pending.

         Rationale: re-implementing a fix while an open PR already exists
         produces a duplicate (or worse, the agent closes its own prior PR
         mid-run and opens a new one with a different approach — exactly the
         thrash observed in `letsoffload/permit-service` PR #81 → #82 and
         `letsoffload/offload` PR #572 → #573, where two PRs for the same
         identifier were opened-and-closed 12 to 16 seconds apart inside a
         single workflow run).

         Only proceed to Step 1 if no open PR exists for the identifier.

      1. Create a feature branch from the base branch (check context for
         baseBranch, default `main`). **Branch name MUST include the issue
         identifier** exactly as ISSUE_ID above.
         Format: lowercase the identifier and use it as a prefix, e.g.
         `off-1234-fix-null-check`. If the repository uses a different branch
         convention (check context.branchPattern or the rules/CLAUDE.md for a
         regex), follow that — but the identifier piece MUST still come from
         ISSUE_ID, never from a Sentry short-ID.

      2. Read the relevant source files to understand the current code AND read
         the nearest existing test file (e.g. `foo.service.spec.ts` next to
         `foo.service.ts`, or `foo_test.py` next to `foo.py`) so your new tests
         match the existing test conventions: framework, mock style, factory use,
         describe/it shape, naming.

      3. Make the necessary code change. Keep it minimal and focused — do not
         refactor surrounding code or add unrelated improvements.

      4. **Write tests for the fix.** See Test Requirements below.

      5. **Run the test suite for the affected package** and confirm green
         (the package's `test` command from package.json, `pytest` for Python,
         etc.). If the test runner is not obvious, read the project's
         CLAUDE.md / README / package.json scripts. If you cannot run the
         tests at all in this environment, say so explicitly in the output —
         do not claim "tests pass" when you didn't run them.

      6. Stage and commit with a clear commit message. Start the message with the
         issue identifier in brackets, e.g.
         `[OFF-1234] fix: guard null projectId before database lookup`.

      ## Scope boundary — do NOT open the PR here

      Stop after the commit. Do NOT push the branch, do NOT run `gh pr create`,
      do NOT call any PR-creation tool. The dedicated `create_pr` node pushes the
      branch and requests the PR. Opening it from this node bypasses the workflow's
      eval gate and triggers a self-close-and-recreate workaround (PR opened via
      shell, then `github_create_pr` returns 422 "already exists" against the same
      branch, then the agent closes the first PR to satisfy the eval). The
      idempotent fallback in `github_create_pr` will recover if you ignore this,
      but the cleaner path is: commit only here, let `create_pr` push and open.

      ## Test Requirements

      A code change without a test is unfinished work. Every fix this node ships
      MUST come with at least one new test case that:

      - **Would fail on the unfixed code.** A test that passes both before and
         after the fix is decoration, not a regression guard. Mentally run it
         against the previous version; if it would have passed, it is not the
         right test.
      - **Asserts the user-facing contract**, not just an implementation
         detail. For an API/handler bug: assert the response shape, status code,
         or error type the client sees. For a data corruption bug: assert the
         persisted row's final state, not just an internal call count.
      - **Covers the obvious adjacent edge cases.** If the bug was "throws plain
         Error on missing record", add the missing-record case AND at least one
         success-path case to confirm the fix didn't break the happy path.
      - **Lives in the right file** (next to the source under test, in the
         project's existing test layout).

      The eval gate on this node REQUIRES `test_status` to be either
      `pass` (tests ran and all passed) OR `no-framework` (the project
      genuinely has no test runner — not "I couldn't be bothered").

      If the project HAS a test framework, you must write tests and they
      must pass. Empty `test_files_changed` with `test_status: pass` is a
      lie and eval will reject it via the schema's required-fields
      contract; `not-run` and `fail` will retry once with reflection and
      then halt for human attention.

      If the fix turns out to be more complex than expected, stop and
      explain why — do not force a bad fix.
    skills:
      - github
    # A write node on purpose (#365): the code change itself. It edits files
    # in the checkout, runs the tests, and commits, which needs file edits and
    # a shell. It does not browse the web (`deny: [net]`, portable across
    # harnesses). Restricting *which* shell commands run (e.g. blocking
    # `gh pr create` / `git push`) needs a per-command policy and is follow-up
    # work.
    permissions:
      access: write
      deny: [net]
    # Structural enforcement of the "do NOT open the PR here" boundary: no
    # GitHub write tool is registered for this node. The PR is create_pr's
    # declared output.
    tools:
      deny:
        - github_create_pr
        - github_create_issue
        - github_add_comment
        - github_add_labels
    output:
      type: object
      properties:
        branch:
          type: string
          description: Feature branch name (must include the issue identifier).
        commit_sha:
          type: string
          description: SHA of the commit shipping the fix and tests.
        files_changed:
          type: array
          description: Source files modified by the fix (NOT including test files).
          items:
            type: string
        test_files_changed:
          type: array
          description: |
            Test files added or modified to cover the fix. Should be
            non-empty whenever `test_status: pass`. May be empty when
            `test_status: no-framework` (genuinely no test runner in
            the repo).
          items:
            type: string
        test_command:
          type: string
          description: Exact command run to validate (e.g. `npx nx test server`).
        test_status:
          type: string
          enum: [pass, fail, no-framework, not-run, skipped]
          description: |
            Outcome of running the test suite.
            - `pass` — tests ran end-to-end and every assertion passed.
              `test_files_changed` MUST be non-empty in this case (you
              changed code; tests must cover it).
            - `no-framework` — the repo genuinely has no test runner
              (e.g. a docs-only repo, a YAML-config repo, a research
              notebook collection). Reserved for cases where there is
              no test infrastructure to extend — not a permission slip
              to skip tests in a normal codebase.
            - `fail` — tests ran and at least one failed. Do not push
              a broken fix. Return this status, retry will fire once.
            - `not-run` — tests exist but the environment couldn't
              execute them. Explain in `test_notes`. Retry will fire.
            - `skipped` — the node short-circuited before running tests
              because a precondition was not met: `open-pr-exists` (Step
              0b found an open PR with the issue identifier in its
              title; `existing_pr_url` MUST be populated) or `staged`
              (Step 0: a preview run filed no issue). `skipped_reason`
              MUST be populated. Downstream `create_pr` is bypassed and
              the workflow routes to `notify`.
        skipped_reason:
          type: string
          description: |
            Why the node short-circuited. Only set when `test_status` is
            `skipped`: `open-pr-exists` (Step 0b) or `staged` (Step 0).
          enum: [open-pr-exists, staged]
        existing_pr_url:
          type: string
          description: |
            URL of the open PR that triggered the skip. Set when
            `skipped_reason` is `open-pr-exists` so the notify node
            can link to the prior PR.
          pattern: "^https?://"
        test_notes:
          type: string
          description: One-paragraph explanation of which tests were added and what they assert.
      required:
        - branch
        - commit_sha
        - files_changed
        - test_files_changed
        - test_status
    eval:
      # `pass`, `no-framework`, and `skipped` clear the gate. `fail` and
      # `not-run` trigger retry. `skipped` is the Step 0b short-circuit
      # (open PR already exists for the issue identifier) — see the
      # implement instruction for the driving incidents
      # (letsoffload/permit-service #81 → #82,
      # letsoffload/offload #572 → #573).
      - name: test_status_is_pass_or_no_framework
        kind: value
        rule:
          output_matches:
            - path: test_status
              in: [pass, no-framework, skipped]
      # Conditional: when test_status is pass, test_files_changed MUST contain
      # at least one real test file path. Empty array with status pass is a
      # contract violation (the agent claimed it ran tests without actually
      # writing any). value evaluators can't express the conditional
      # declaratively; the judge absorbs it.
      #
      # Driving incident: PR #366, where the triage agent shipped a NestJS
      # fix to letsoffload/offload without writing tests, even though
      # *.spec.ts existed in the repo.
      - name: tests_present_when_pass_claimed
        kind: judge
        rubric: |
          You are checking the contract between test_status and test_files_changed.

          Read result.data.test_status and result.data.test_files_changed.

          Rules:
          - If test_status is "pass": test_files_changed MUST contain at least
            one real test file path (paths with extensions like .spec.ts,
            .test.ts, .test.tsx, .test.py, _test.go, _spec.rb, .test.rs,
            etc., or paths in a __tests__/, tests/, or spec/ directory).
            An empty array, or paths that are clearly not test files
            (README.md, package.json, source files), is a contract violation.
          - If test_status is "no-framework": test_files_changed MAY be empty.
            Pass vacuously.
          - If test_status is "skipped": test_files_changed MAY be empty.
            The node short-circuited before writing any code. When
            skipped_reason is "open-pr-exists" (Step 0b found an open PR
            for the issue), `existing_pr_url` MUST be populated; when it
            is "staged" (a preview run), nothing else is required. If
            skipped_reason is missing, return no.
          - If test_status is "fail" or "not-run": this evaluator should not
            run (the prior value evaluator catches that). Pass vacuously.

          Respond yes if the contract is satisfied, no if it is violated.
        pass_when: yes
    retry:
      max: 1
      instruction:
        auto: true
  create_pr:
    name: Open Pull Request
    # A failed PR must not stop the run: the only edge is an unconditional one to notify.
    on_fail: continue
    instruction: >-
      Open a pull request for the fix. The issue is in your context from the create_issue step; its identifier
      (ISSUE_ID) is the `ref` of the applied `issue` entry in `context.create_issue.safe_outputs`, else
      `context.create_issue.issueIdentifier`. The branch is `context.implement.branch`.


      1. Push the branch to the remote. If the push fails for lack of credentials (a checkout made with
      `persist-credentials: false`), go on: sweny pushes the head branch itself before it opens the PR.

      2. Request the PR: with `emit_output` (type `pr`, `head` = the branch, `base` = the base branch,
      default `main`) when you have it; sweny opens it after this step and reuses an open PR for the same
      branch instead of failing. Without `emit_output`, call `github_create_pr` (use this exact tool name,
      not `create_pull_request` or any other variant from ToolSearch); if it returns `reused: true`, treat
      it as success and do NOT close it and call again.

      3. PR title MUST start with the issue identifier in brackets.
      Format: `[ISSUE_ID] fix: {short description}`.

      4. In the PR body, include: summary of the bug, what the fix does, and a link to the issue
      (its `url` in `context.create_issue.safe_outputs`, else context.create_issue.issueUrl). If the
      investigation found a Sentry issue, include "Fixes {sentryShortId}" in the PR body so Sentry
      auto-resolves on merge. If the issue tracker is Linear, also include the line "Fixes ISSUE_ID"
      (e.g. "Fixes OFF-1234") so Linear links the PR and moves the issue to Done on merge.

      5. Labels: `["sweny", "agent", "triage"]`.


      If context.prTemplate is provided, use it as the format for the PR body. Otherwise use a clear structure with:
      Summary, Changes, Testing, and Related Issues.


      If context.cloudRunId is provided, append this HTML comment to the end of the PR body: <!--
      sweny:run_id:{context.cloudRunId} -->


      Return the branch and the PR title you requested (and the PR URL and number when a tool returned them).
    skills:
      - github
    # A write node on purpose (#365): pushing the branch ships the code change
    # and needs git in a shell. The PR itself is a declared output, so the
    # agent never holds the PR write; no GitHub write tool is registered here.
    permissions: write
    outputs:
      - type: pr
        max: 1
        labels: [sweny, agent, triage]
    tools:
      deny:
        - github_create_pr
        - github_create_issue
        - github_add_comment
        - github_add_labels
    eval:
      - name: pr_was_created
        kind: function
        rule:
          any_tool_called:
            - emit_output
            - github_create_pr
    retry:
      max: 1
      instruction:
        auto: true
  notify:
    name: Notify Team
    instruction: |-
      Send a notification summarizing the triage result:

      1. Include: alert summary, severity, root cause (1-2 sentences), and links to any created issues or PRs.
         Issues and PRs sweny filed are in `safe_outputs` of the create_issue, skip and create_pr steps
         (`ref` and `url` of each `applied` entry).
      2. For critical/high severity, make the notification urgent.
      3. For medium/low, a standard notification is fine.
      4. If any `safe_outputs` entry has status `staged`, this run is a preview: send nothing, and put the
         notification you would have sent in your summary.

      Use whichever notification channel is available to you.
    skills:
      - slack
      - notification
edges:
  - from: gather
    to: investigate
  # Deterministic routing (#461): sweny evaluates these expressions over the
  # declared, required outputs of investigate, with no model call. The two
  # are complements over the declared enum, so exactly one is true.
  - from: investigate
    to: create_issue
    when:
      expr: "investigate.novel_count > 0 && investigate.highest_severity in ['medium', 'high', 'critical']"
  - from: investigate
    to: skip
    when:
      expr: "investigate.novel_count == 0 || investigate.highest_severity == 'low'"
  # Deterministic too (#357): fixable_count counts exactly the novel findings
  # the old natural-language condition asked about (fix_complexity simple or
  # moderate AND a fix_approach), so `> 0` is that condition and the default
  # edge is its complement. fixable_count is required: a missing one fails
  # investigate (output contract), which halts the run before create_issue.
  - from: create_issue
    to: implement
    when:
      expr: "investigate.fixable_count > 0"
  - from: create_issue
    to: notify
  - from: skip
    to: notify
  # test_status is required and the node's eval only lets pass, no-framework
  # and skipped through (fail and not-run fail the node, which halts), so
  # exactly one of these is true. skipped: Step 0b found an open PR for the
  # issue, or Step 0 found a staged preview.
  - from: implement
    to: notify
    when:
      expr: "implement.test_status == 'skipped'"
  - from: implement
    to: create_pr
    when:
      expr: "implement.test_status in ['pass', 'no-framework']"
  - from: create_pr
    to: notify
