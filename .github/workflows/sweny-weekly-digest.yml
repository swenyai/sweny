# Dogfood (#537): the bundled weekly-digest pack, installed the way
# `sweny new --template weekly-digest` writes it, plus the repo's own limits:
# a per-run spend cap, a fail-closed agent sandbox, and a concurrency group.
# Workflow: .sweny/workflows/weekly-digest.yml (a copy of the pack; keep in sync
# with packages/core/src/cli/packs.ts DIGEST_YAML). Read-only except one
# digest issue per week (a safe output sweny applies) and the failure alert.
name: SWEny weekly digest
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # deliver: issue, and the failure alert

concurrency:
  group: sweny-weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: swenyai/sweny@v5
        with:
          workflow: .sweny/workflows/weekly-digest.yml
          notify-on-failure: issue # one sticky issue, only when a run fails
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          input: '{"repo": "${{ github.repository }}"}'
          max-cost: "1.00" # USD per run, harness-reported; a crossing halts the run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SWENY_SANDBOX: strict # fail closed instead of running the agent unsandboxed
