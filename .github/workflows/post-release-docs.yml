name: Post-Release Docs Update

# The release pipeline (release.yml tag-action) cuts git tags, not GitHub
# Releases, so a `release: published` trigger never fired. Trigger on the
# immutable v5.<core-version> tags instead. github.ref_name is then the tag
# (e.g. v5.0.1.102), which the prompt and PR branch already interpolate.
# The moving `v5` tag has no dot after "v5" so the `v5.*` glob skips it.
on:
  push:
    tags:
      - "v5.*"

permissions:
  contents: read

jobs:
  update-docs:
    name: Update docs for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CHANGELOG.md is retired; release notes are the GitHub Release that
      # tag-action creates. Read the changes straight from git so this job
      # does not race the release creation.
      - name: List changes since the previous release
        id: changes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git tag -l 'v5.*' --sort=-v:refname | awk -v t="$TAG" 'f && !done { print; done = 1 } $0 == t { f = 1 }')
          RANGE="$TAG"
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; fi
          {
            echo "list<<SWENY_CHANGES_EOF"
            git log --no-merges --max-count=200 --format='- %s (%h)' "$RANGE" \
              | grep -vE '^- chore(\(action\))?: (release packages|pin cli-version)' || true
            echo "SWENY_CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update docs with Claude
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A new release (${{ github.ref_name }}) was just published.

            Update the docs so they reflect the new release:

            1. These commits landed in ${{ github.ref_name }} since the previous release:

            ${{ steps.changes.outputs.list }}

            2. In packages/web/src/content/docs/**/*.md and README.md, find all version
               references like `swenyai/sweny@vX.Y` or `@sweny-ai/...@X.Y` and update them
               to ${{ github.ref_name }}.
            3. Review the docs for any descriptions of inputs, providers, or behavior that
               changed in ${{ github.ref_name }} per those commits — update those sections.
            4. Only change what is factually stale. Do not rewrite or expand docs beyond
               what changed.

            After making all edits, stop. Do not commit or push.

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs/post-release-${{ github.ref_name }}
          title: "docs: update for ${{ github.ref_name }}"
          body: |
            Auto-generated docs update for release **${{ github.ref_name }}**.

            Claude reviewed the commits since the previous release and updated stale version references and doc sections.
            Please review before merging.
          commit-message: "docs: update for ${{ github.ref_name }}"
          labels: documentation
          delete-branch: true
