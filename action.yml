name: "SWEny — Run AI Workflow"
description: "Run any SWEny workflow YAML on GitHub Actions. See also swenyai/triage and swenyai/e2e."
author: "SWEny"

branding:
  icon: "play"
  color: "orange"

inputs:
  workflow:
    description: "Path to the workflow YAML file to execute (relative to working-directory)."
    required: true

  claude-oauth-token:
    description: "Claude Code OAuth token. Use this OR anthropic-api-key. OAuth tokens do not consume API credit."
    required: false
  anthropic-api-key:
    description: "Anthropic API key for Claude (x-api-key). Use this OR claude-oauth-token."
    required: false
  anthropic-auth-token:
    description: "Bearer token (Authorization: Bearer) for gateways that expect it. Sets ANTHROPIC_AUTH_TOKEN. Distinct from anthropic-api-key (x-api-key)."
    required: false
  anthropic-base-url:
    description: "Anthropic-compatible base URL (e.g. a LiteLLM gateway). Sets ANTHROPIC_BASE_URL. See docs: Using a model gateway."
    required: false
  sweny-auth:
    description: "Auth mode: auto (default), api-key, or oauth. Set 'api-key' to authenticate a gateway with anthropic-api-key / anthropic-auth-token even when an OAuth token is also present."
    required: false
    default: "auto"

  agent:
    description: "Coding agent that runs the nodes: claude (default) or codex. codex needs openai-api-key and installs the Codex CLI (@openai/codex)."
    required: false
    default: "claude"
  openai-api-key:
    description: "OpenAI API key for agent: codex. Passed to Codex as CODEX_API_KEY."
    required: false
  codex-version:
    description: "Version of @openai/codex to install when agent is codex. Defaults to the version sweny's Codex capability claims were tested against (TESTED_CODEX_VERSION in harness/codex.ts). sweny needs 0.159.0 or newer; a newer Codex runs with a warning. Set 'latest' to opt in to untested versions."
    required: false
    default: "0.159.2"
  harness-policy:
    description: "strict refuses a node whose policy the agent cannot enforce (for example tools.deny: [write] on codex); warn runs it and reports it in the receipt. Empty uses the CLI default, which is strict under GitHub Actions."
    required: false
    default: ""

  cli-version:
    description: "Version of @sweny-ai/core to install (the package that ships the `sweny` CLI). Defaults to latest on the floating v5 tag; an immutable v5.<version> tag defaults to that exact version."
    required: false
    default: "latest"

  node-version:
    description: "Node.js version to install."
    required: false
    default: "24"

  working-directory:
    description: "Working directory to run the workflow from. Defaults to the repository root."
    required: false
    default: "."

  setup-only:
    description: "When 'true', install and probe the agent and its sandbox, then stop without running the workflow or calling a model. For CI that proves a runner can host an agent."
    required: false
    default: "false"

  dry-run:
    description: "When 'true', run with read-only tools only: write tools, external MCP servers, and shell/file-edit tools are withheld, so nothing is created, posted, or sent. Stops at the first natural-language conditional edge."
    required: false
    default: "false"

  timeout:
    description: "Whole-run wall-clock budget in milliseconds, forwarded to `sweny workflow run --timeout`. Empty uses the CLI default (3600000 = 60 min). Use 0 for no wall-clock budget."
    required: false
    default: ""

  max-steps:
    description: "Hard cap on total node executions (including eval-failure retries), forwarded to `sweny workflow run --max-steps`. Empty uses the CLI default (200)."
    required: false
    default: ""

  max-tokens:
    description: "Run-wide token budget (input plus output tokens), forwarded to `sweny workflow run --max-tokens` only when set. The lowest of this and the workflow's `budget.tokens` wins. A crossing stops the agent, fails the node, and halts the run. Fails the step on a CLI too old to enforce it, so a cap is never silently dropped."
    required: false
    default: ""

  max-cost:
    description: "Run-wide cost budget in US dollars, forwarded to `sweny workflow run --max-cost` only when set. Uses harness-reported cost (never estimated). The lowest of this and the workflow's `budget.cost_usd` wins. Fails the step on a CLI too old to enforce it."
    required: false
    default: ""

  verbose:
    description: "When 'true', print each tool call's input and output inline. Truncated for readability; use the CLI's --stream flag locally for full untruncated NDJSON. Helpful for debugging a node that halts or fails."
    required: false
    default: "false"

  input:
    description: |
      JSON object of per-run inputs for the workflow. Forwarded verbatim to
      `sweny workflow run --input '<json>'`. When the workflow declares an
      `inputs` block, the CLI validates this string against the declaration
      (type-check, required-field check, default-fill) and fails with a
      readable diff when the shape doesn't match. When the workflow does NOT
      declare `inputs`, the JSON is passed through unchanged for back-compat.

      Example (release-notes-style):
        input: |
          {
            "since_tag": "v1.41.12",
            "until_tag": "v1.41.13",
            "draft": true
          }
    required: false
    default: ""

  pr-comment:
    description: |
      Post or update one sticky comment on the pull request with the run receipt,
      a status-colored Mermaid DAG, and per-node status and duration. Metadata
      only: no prompts, tool inputs, or model output. Only acts on pull_request
      events (no-op on every other event). Uses the job's GITHUB_TOKEN, so the
      job needs `permissions: pull-requests: write` (fork PRs get a read-only
      token, so the post is skipped with a warning). A failed post warns and
      never fails the job. Set to 'false' to opt out. Requires an @sweny-ai/core
      version that supports `--comment-file`.
    required: false
    default: "true"

  cloud-token:
    description: "Project token (sweny_pk_...) enabling opt-in run reporting. Optional, and not currently available. Token minting is not yet exposed, so leaving this unset (the default) means no outbound reporting request is made. Equivalent to setting the SWENY_CLOUD_TOKEN env var; either form is accepted."
    required: false

runs:
  using: "composite"
  steps:
    - name: Validate auth inputs
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        HAS_OAUTH: ${{ inputs.claude-oauth-token != '' }}
        HAS_API_KEY: ${{ inputs.anthropic-api-key != '' }}
        HAS_AUTH_TOKEN: ${{ inputs.anthropic-auth-token != '' }}
        HAS_OPENAI_KEY: ${{ inputs.openai-api-key != '' }}
      run: |
        case "${AGENT:-claude}" in
          claude)
            if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_API_KEY" != "true" ] && [ "$HAS_AUTH_TOKEN" != "true" ]; then
              echo "::error::Provide one of: claude-oauth-token, anthropic-api-key, or anthropic-auth-token"
              exit 1
            fi
            ;;
          codex)
            if [ "$HAS_OPENAI_KEY" != "true" ]; then
              echo "::error::agent: codex needs openai-api-key"
              exit 1
            fi
            ;;
          *)
            echo "::error::agent must be claude or codex (got '$AGENT')"
            exit 1
            ;;
        esac

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install SWEny CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: npm install -g "@sweny-ai/core@${CLI_VERSION}"

    - name: Install Codex CLI
      if: inputs.agent == 'codex'
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: |
        npm install -g "@openai/codex@${CODEX_VERSION}"
        codex --version

    # Agent sandbox deps (#360). SWENY_SANDBOX=auto (default) sandboxes agent
    # shell commands when bubblewrap + socat work and otherwise warns and runs
    # unsandboxed, so this step is best-effort and never fails the job.
    - name: Install agent sandbox dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        SUDO=""
        if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo -n"; fi
        if ! command -v bwrap >/dev/null 2>&1 || ! command -v socat >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            if ! { $SUDO apt-get update -qq && $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat; } >/dev/null 2>&1; then
              echo "::warning title=SWEny agent sandbox::Could not install bubblewrap/socat with apt; agent commands will run unsandboxed (SWENY_SANDBOX=auto)."
            fi
          else
            echo "::notice title=SWEny agent sandbox::apt-get not found; install bubblewrap and socat to sandbox agent commands."
          fi
        fi
        # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor,
        # which bubblewrap needs. Only relax the host kernel setting when the
        # caller explicitly asked for SWENY_SANDBOX=strict.
        if command -v bwrap >/dev/null 2>&1 && ! bwrap --ro-bind / / --dev /dev --proc /proc true >/dev/null 2>&1; then
          if [ "${SWENY_SANDBOX:-}" = "strict" ]; then
            $SUDO sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          fi
        fi
        exit 0

    # Non-Claude agents run under the srt process wrapper (harness/sandbox-wrapper.ts),
    # and GitHub Actions defaults the harness policy to strict, so a runner without a
    # working srt refuses the first Codex node. Install the pinned srt (same pin as the
    # ci.yml sandbox-wrapper job; a test keeps them equal), ripgrep and, if the probe
    # needs it, the AppArmor relaxation, then prove srt can wrap a command. Claude-only
    # runs skip this step.
    - name: Install and probe the agent sandbox wrapper (srt)
      if: inputs.agent != 'claude'
      shell: bash
      env:
        SRT_VERSION: "0.0.78"
        AGENT: ${{ inputs.agent }}
      run: |
        if [ "${SWENY_SANDBOX:-}" = "off" ]; then
          echo "::notice title=SWEny sandbox wrapper::SWENY_SANDBOX=off; skipping srt install"
          exit 0
        fi
        SUDO=""
        if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo -n"; fi
        if [ "$RUNNER_OS" = "Linux" ]; then
          missing=""
          for b in bwrap socat rg; do command -v "$b" >/dev/null 2>&1 || missing="$missing $b"; done
          if [ -n "$missing" ] && command -v apt-get >/dev/null 2>&1; then
            { $SUDO apt-get update -qq && $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat ripgrep; } >/dev/null 2>&1 || true
          fi
        elif [ "$RUNNER_OS" = "macOS" ]; then
          command -v rg >/dev/null 2>&1 || brew install ripgrep >/dev/null 2>&1 || true
        fi
        if ! npm install -g --ignore-scripts "@anthropic-ai/sandbox-runtime@${SRT_VERSION}" >/dev/null 2>&1; then
          echo "::error title=SWEny sandbox wrapper::could not install @anthropic-ai/sandbox-runtime@${SRT_VERSION}. agent: ${AGENT} needs it to sandbox agent commands; set SWENY_SANDBOX=off to run unsandboxed."
          exit 1
        fi
        SETTINGS="${RUNNER_TEMP:-/tmp}/srt-probe.json"
        echo '{"network":{"allowedDomains":[],"deniedDomains":[]},"filesystem":{"denyRead":[],"allowRead":[],"allowWrite":[],"denyWrite":[]}}' > "$SETTINGS"
        probe() { srt --settings "$SETTINGS" -- true >/dev/null 2>&1; }
        if ! probe && [ "$RUNNER_OS" = "Linux" ]; then
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which bubblewrap needs.
          $SUDO sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
        fi
        if ! probe; then
          echo "::error title=SWEny sandbox wrapper::srt ${SRT_VERSION} is installed but cannot wrap a command on this runner (needs bubblewrap, socat, ripgrep and unprivileged user namespaces). Fix the runner, or set SWENY_SANDBOX=off and harness-policy: warn to run agent commands unsandboxed."
          srt --settings "$SETTINGS" -- true 2>&1 | head -5 || true
          exit 1
        fi
        echo "srt ${SRT_VERSION} wraps commands on this runner"

    - name: Run workflow
      if: inputs.setup-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic-auth-token }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        SWENY_AUTH: ${{ inputs.sweny-auth }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        AGENT: ${{ inputs.agent }}
        INPUT_HARNESS_POLICY: ${{ inputs.harness-policy }}
        WORKFLOW_PATH: ${{ inputs.workflow }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERBOSE: ${{ inputs.verbose }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MAX_STEPS: ${{ inputs.max-steps }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_MAX_COST: ${{ inputs.max-cost }}
        WORKFLOW_INPUT: ${{ inputs.input }}
        INPUT_CLOUD_TOKEN: ${{ inputs.cloud-token }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_FILE: ${{ runner.temp }}/sweny-run-comment.md
      run: |
        # Forward the cloud token to the CLI. Prefer the explicit `cloud-token`
        # input; otherwise honor whatever the caller put on the step env as
        # SWENY_CLOUD_TOKEN. Never overwrite a non-empty inherited value with
        # an empty input.
        if [ -n "$INPUT_CLOUD_TOKEN" ]; then
          export SWENY_CLOUD_TOKEN="$INPUT_CLOUD_TOKEN"
        fi
        # Normalize boolean-ish inputs (true / TRUE / 1 / yes).
        normalize() {
          local v
          v=$(echo "${1:-false}" | tr '[:upper:]' '[:lower:]')
          case "$v" in true|1|yes) echo "true" ;; *) echo "false" ;; esac
        }
        DRY_NORM=$(normalize "$DRY_RUN")
        VERBOSE_NORM=$(normalize "$VERBOSE")

        FLAGS=()
        # PR billboard: only on pull_request events (PR_NUMBER is empty otherwise).
        PR_COMMENT_NORM=$(normalize "$PR_COMMENT")
        rm -f "$COMMENT_FILE"
        if [ "$PR_COMMENT_NORM" = "true" ] && [ -n "$PR_NUMBER" ]; then
          # Feature-detect: an older installed CLI has no --comment-file and
          # would fail the run. Capture help first (no pipe into grep -q, which
          # can SIGPIPE the CLI and trip pipefail).
          RUN_HELP=$(sweny workflow run --help 2>/dev/null || true)
          if grep -q -- '--comment-file' <<< "$RUN_HELP"; then
            FLAGS+=("--comment-file" "$COMMENT_FILE")
          else
            echo "::notice::installed sweny CLI does not support PR comments yet; skipping"
          fi
        fi
        [ "$DRY_NORM" = "true" ] && FLAGS+=("--dry-run")
        [ "$VERBOSE_NORM" = "true" ] && FLAGS+=("--verbose")
        if [ -n "$INPUT_TIMEOUT" ]; then
          FLAGS+=("--timeout" "$INPUT_TIMEOUT")
        fi
        if [ -n "$INPUT_MAX_STEPS" ]; then
          FLAGS+=("--max-steps" "$INPUT_MAX_STEPS")
        fi
        # Spend caps (#449): forwarded only when set. An older CLI would reject
        # the flag, and running without the cap the caller asked for is worse,
        # so a CLI that lacks it fails the step.
        if [ -n "$INPUT_MAX_TOKENS" ] || [ -n "$INPUT_MAX_COST" ]; then
          RUN_HELP_SPEND=$(sweny workflow run --help 2>/dev/null || true)
          if [ -n "$INPUT_MAX_TOKENS" ]; then
            if ! grep -q -- '--max-tokens' <<< "$RUN_HELP_SPEND"; then
              echo "::error::the installed sweny CLI does not support max-tokens; set cli-version to a release that does"
              exit 1
            fi
            FLAGS+=("--max-tokens" "$INPUT_MAX_TOKENS")
          fi
          if [ -n "$INPUT_MAX_COST" ]; then
            if ! grep -q -- '--max-cost' <<< "$RUN_HELP_SPEND"; then
              echo "::error::the installed sweny CLI does not support max-cost; set cli-version to a release that does"
              exit 1
            fi
            FLAGS+=("--max-cost" "$INPUT_MAX_COST")
          fi
        fi
        # Forward per-run inputs verbatim. Pass through env to avoid shell
        # quoting issues with nested JSON; the CLI parses and validates the
        # string against the workflow's declared `inputs` block (if any) and
        # fails with a readable error when the shape doesn't match.
        if [ -n "$WORKFLOW_INPUT" ]; then
          FLAGS+=("--input" "$WORKFLOW_INPUT")
        fi
        # Harness policy travels by env, which an older CLI simply ignores.
        if [ -n "$INPUT_HARNESS_POLICY" ]; then
          export SWENY_HARNESS_POLICY="$INPUT_HARNESS_POLICY"
        fi
        # --agent only for a non-default agent, and only on a CLI that has it:
        # an older CLI would reject the flag, and silently running Claude would be worse.
        if [ -n "$AGENT" ] && [ "$AGENT" != "claude" ]; then
          RUN_HELP_AGENT=$(sweny workflow run --help 2>/dev/null || true)
          if ! grep -q -- '--agent' <<< "$RUN_HELP_AGENT"; then
            echo "::error::the installed sweny CLI does not support agent: $AGENT; set cli-version to a release that does"
            exit 1
          fi
          FLAGS+=("--agent" "$AGENT")
        fi

        sweny workflow run "$WORKFLOW_PATH" "${FLAGS[@]}"

    - name: Post PR comment
      if: ${{ !cancelled() && inputs.setup-only != 'true' && inputs.pr-comment != 'false' && github.event.pull_request.number != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_FILE: ${{ runner.temp }}/sweny-run-comment.md
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/scripts/post-run-comment.sh"
