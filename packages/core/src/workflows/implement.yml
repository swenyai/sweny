id: implement
name: Implement Fix
workflow_type: pr_review
description: Implement a code fix for an issue and open a pull request
entry: analyze
# Ceiling (#365). `write` because implement and create_pr change code in the
# checkout and push a branch; analyze and skip narrow to `read`. External
# writes (the PR, a comment on the issue) happen only as declared outputs.
permissions: write
safe_outputs:
  allow: [comment, pr]
  max: 3
nodes:
  analyze:
    name: Analyze Issue
    instruction: |-
      Read the issue details and understand what needs to be fixed:

      1. Fetch the issue from the tracker (GitHub or Linear).
      2. **Check for an existing open PR for this issue.** Call
         `github_search_issues` (GitHub's `/search/issues` endpoint returns
         both issues and PRs) with `type:pr state:open` and the issue
         identifier wrapped in brackets — e.g. query
         `[OFF-1234] in:title type:pr state:open`. If the response contains
         one or more PRs whose title starts with `[<issueIdentifier>]`,
         STOP analysis. Output `has_open_pr: true`, `existing_pr_url`
         (the URL of the open PR) and a short `issue_summary` noting the
         skip; leave `fix_plan` set to a one-line "Skip: open PR
         <url> already exists". The workflow will route to `notify` and
         the team will be told the prior PR is still pending.
         Rationale: re-implementing while an open PR exists produces a
         duplicate (or worse, the agent closes its own prior PR mid-run
         and opens a new one — exactly the thrash seen in
         `letsoffload/permit-service` PR #81 → #82 and
         `letsoffload/offload` PR #572 → #573).
      3. Read the relevant source files to understand the current code.
      4. Identify the exact files and lines that need to change.
      5. Plan the fix approach.

      Output a clear analysis of what needs to change and why, plus three
      routing fields: `has_open_pr` (true only when step 2 found an open PR),
      `risk_level` (low, medium or high), and `plan_is_clear` (true only when
      the plan names the exact files and changes). sweny implements the fix
      only when there is no open PR, the risk is low or medium, and the plan
      is clear; otherwise it skips.
    skills:
      - github
      - linear
    # #365: analysis only. No write tool or write-capable built-in reaches it.
    permissions: read
    output:
      type: object
      properties:
        issue_summary:
          type: string
        files_to_change:
          type: array
          items:
            type: string
        fix_plan:
          type: string
        risk_level:
          type: string
          enum:
            - low
            - medium
            - high
        existing_pr_url:
          type: string
          description: |
            URL of an open PR found in step 2 whose title starts with the
            issue identifier in brackets. Set ONLY when a prior PR exists
            and the analyze node is short-circuiting. Triggers the
            `analyze → notify` edge.
          pattern: "^https?://"
        has_open_pr:
          type: boolean
          description: |
            true when step 2 found an open PR for this issue (and
            existing_pr_url is set), else false. Routes analyze to notify.
        plan_is_clear:
          type: boolean
          description: |
            true when fix_plan names the exact files and changes, so the fix
            can be implemented without guessing; false when the fix is
            unclear or needs a decision first.
      required:
        - issue_summary
        - fix_plan
        - has_open_pr
        - risk_level
        - plan_is_clear
  implement:
    name: Implement Fix
    instruction: |-
      Implement the planned fix:

      1. Create a feature branch. The branch name MUST start with the issue
         identifier from `context.input.issueIdentifier`, lowercased, followed
         by a short kebab-case description: e.g. `off-1234-fix-null-check`.
      2. Make the necessary code changes.
      3. Ensure changes are minimal and focused — fix the bug, nothing more.
      4. Stage and commit. Start the commit message with the issue identifier
         in brackets, e.g. `[OFF-1234] fix: guard null projectId`.

      Stop after the commit. Do NOT push or open the PR: the dedicated `create_pr`
      node pushes the branch and requests the PR.

      If the fix is too risky or complex, explain why and skip.
    skills:
      - github
    # A write node on purpose (#365): the code change itself. It edits files
    # and commits, which needs file edits and a shell (`git add`/`git commit`,
    # test runners). Same rationale as the triage workflow: keep it on the
    # repo, no web (`deny: [net]`, portable across harnesses), and no GitHub
    # write tool (the PR is create_pr's declared output).
    permissions:
      access: write
      deny: [net]
    tools:
      deny:
        - github_create_pr
        - github_create_issue
        - github_add_comment
        - github_add_labels
  create_pr:
    name: Open Pull Request
    # A failed PR must not stop the run: the only edge is an unconditional one to notify.
    on_fail: continue
    instruction: >-
      Open a pull request for the fix:


      1. Push the branch to the remote. If the push fails for lack of credentials (a checkout made with
      `persist-credentials: false`), go on: sweny pushes the head branch itself before it opens the PR.

      2. Request the PR: with `emit_output` (type `pr`, `head` = the branch, `base` = the base branch,
      default `main`) when you have it; sweny opens it after this step and reuses an open PR for the same
      branch instead of failing. Without `emit_output`, call `github_create_pr`. The PR title MUST start
      with the issue identifier in brackets: `[{context.input.issueIdentifier}] type: short description`
      (e.g. `[OFF-1234] fix: guard null projectId`).

      3. Reference the original issue in the PR body. If the issue tracker is Linear, include the line
      "Fixes {context.input.issueIdentifier}" (e.g. "Fixes OFF-1234") so Linear links the PR and moves
      the issue to Done on merge.

      4. Labels: add `task` (or `feature` if the issue is a feature request); `sweny` and `agent` are
      always added.


      If context.prTemplate is provided, use it as the format for the PR body. Otherwise use a clear structure with:
      Summary, Changes, Testing, and Related Issues.


      If context.cloudRunId is provided, append this HTML comment to the end of the PR body: <!--
      sweny:run_id:{context.cloudRunId} -->


      Return the branch and the PR title you requested.
    skills:
      - github
    # A write node on purpose (#365): pushing the branch ships the code change
    # and needs git in a shell. The PR itself is a declared output, so the
    # agent never holds the PR write; no GitHub write tool is registered here.
    permissions: write
    outputs:
      - type: pr
        max: 1
        labels: [sweny, agent]
    tools:
      deny:
        - github_create_pr
        - github_create_issue
        - github_add_comment
        - github_add_labels
  notify:
    name: Notify
    instruction: |-
      Send a notification about the implementation result:

      1. Include: issue reference, PR link, brief summary of changes. The PR sweny opened is in
         `context.create_pr.safe_outputs` (`ref` and `url` of the `applied` entry).
      2. Keep it concise: one message, not a wall of text.
      3. If any `safe_outputs` entry has status `staged`, this run is a preview: send nothing, and put the
         notification you would have sent in your summary.
    skills:
      - slack
      - notification
  skip:
    name: Skip - Too Complex
    instruction: |-
      The fix was determined to be too complex or risky for automated implementation.
      Add a comment to the issue explaining what was found and why it needs manual attention
      (with `emit_output` type `comment` when you have it).
    skills:
      - linear
      - github
    # #365: one comment, and only on the issue this run is for.
    outputs:
      - type: comment
        max: 1
        number: { input: issueIdentifier }
edges:
  # Deterministic routing (#357), equivalent to the old natural-language
  # conditions over declared fields: an open PR (has_open_pr, set together
  # with existing_pr_url) goes to notify; otherwise risk low or medium with a
  # clear plan goes to implement; anything else (high risk, unclear plan, or
  # a missing field) takes the default edge to skip. The two expressions are
  # exclusive (has_open_pr true vs false), so at most one is true.
  - from: analyze
    to: notify
    when:
      expr: "analyze.has_open_pr == true"
  - from: analyze
    to: implement
    when:
      expr: "analyze.has_open_pr == false && analyze.risk_level in ['low', 'medium'] && analyze.plan_is_clear == true"
  - from: analyze
    to: skip
  - from: implement
    to: create_pr
  - from: skip
    to: notify
  - from: create_pr
    to: notify
