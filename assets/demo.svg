<text class="r k26" x="24" y="620" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">duration</tspan><tspan x="149.60">23s</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k27" x="24" y="639" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">tokens</tspan><tspan x="149.60">2.9k</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k28" x="24" y="658" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">cost</tspan><tspan x="149.60">$0.21</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k29" x="24" y="677" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c0">policy</tspan><tspan x="149.60">env scoped, sandbox on</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k30" x="24" y="696" xml:space="preserve"><tspan x="39.70" class="c0">├╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┤</tspan></text>
<text class="r k31" x="24" y="715" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="126.05" class="c1 b">[ ENV SCOPED · SANDBOXED ]</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k32" x="24" y="734" xml:space="preserve"><tspan x="39.70" class="c0">╰┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄╯</tspan></text>
<text class="r k33" x="24" y="753" xml:space="preserve"></text>
<text class="r k34" x="24" y="772" xml:space="preserve"><tspan x="39.70" class="c0">Run it on your repo:</tspan><tspan x="212.40" class="b">npx @sweny-ai/core new --template explain-repo</tspan></text>
