name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is the action default (action.yml node-version), so the version
        # most consumers run the action on is exercised in CI.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - run: npm run test

  package-audit:
    name: Core package exports and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      # Both audits inspect the same publishable artifact, including only files
      # npm would ship. Checking the workspace can hide missing packed files.
      - name: Pack core
        run: |
          mkdir "$RUNNER_TEMP/core-package-audit"
          npm pack --workspace=packages/core --pack-destination "$RUNNER_TEMP/core-package-audit"

      - name: Check published exports
        run: npx --yes publint@0.3.24 --strict "$RUNNER_TEMP/core-package-audit/"*.tgz

      # Core is ESM-only; require Node ESM and bundler resolution, not require().
      # Keep automatic entrypoint discovery so new exports join the audit.
      - name: Check published TypeScript declarations
        run: npx --yes @arethetypeswrong/cli@0.18.5 --profile esm-only "$RUNNER_TEMP/core-package-audit/"*.tgz

  smoke-test:
    name: Smoke — core loads without optional deps
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Verify core loads
        run: |
          node --input-type=module <<'EOF'
          import('./packages/core/dist/index.js')
            .then(() => { console.log('✓ @sweny-ai/core loads'); })
            .catch((err) => { console.error('✗', err.message); process.exit(1); });
          EOF

  schema-drift:
    name: Schema — published JSON Schema matches generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core (writes spec/public/schemas/workflow.json)
        run: npm run build --workspace=packages/core

      - name: Assert no diff between checked-in schema and generated output
        run: npm run check:schema-drift --workspace=packages/core

  # Evidence for #360: does SWENY_SANDBOX=auto actually sandbox on a
  # GitHub-hosted runner once the Action's sandbox step has run? Non-required.
  sandbox-probe:
    name: Sandbox probe (bubblewrap on hosted runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install bubblewrap and socat
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat
          echo "PROBE bwrap: $(command -v bwrap) $(bwrap --version 2>&1 || true)"
          echo "PROBE socat: $(command -v socat)"
          echo "PROBE os: $(. /etc/os-release && echo "$PRETTY_NAME"), kernel $(uname -r)"
          echo "PROBE apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the Action's own "Install agent sandbox dependencies" script as a
      # hosted runner would (default auto mode), then asserts bwrap works.
      - name: Run the Action's sandbox step, then probe bwrap
        run: |
          # Dependency-free extraction: the step's `run: |` block (10-space body) up to the next step.
          awk '/- name: Install agent sandbox dependencies/{f=1} f&&/^      run: \|/{r=1;next} r&&/^$/{print;next} r&&/^        /{sub(/^        /,"");print;next} r{exit}' action.yml > "$RUNNER_TEMP/sandbox-step.sh"
          test -s "$RUNNER_TEMP/sandbox-step.sh"
          grep -q apparmor_restrict_unprivileged_userns "$RUNNER_TEMP/sandbox-step.sh"
          RUNNER_ENVIRONMENT=github-hosted SWENY_SANDBOX=auto bash "$RUNNER_TEMP/sandbox-step.sh"
          echo "PROBE apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          if out=$(bwrap --ro-bind / / --dev /dev --proc /proc true 2>&1); then
            echo "PROBE RESULT: bwrap works after the Action step (auto sandboxes on hosted runners)"
          else
            echo "PROBE RESULT: bwrap still fails after the Action step: $out"
            exit 1
          fi

  # #360 step 2: the harness-agnostic process wrapper (harness/sandbox-wrapper.ts)
  # runs any agent process under @anthropic-ai/sandbox-runtime (srt). This job
  # gives the hosted runner what srt needs, probes that srt wraps an arbitrary
  # argv command, then runs the wrapped fake-agent specs with the wrapper
  # REQUIRED (they fail instead of skipping when it is unavailable).
  sandbox-wrapper:
    name: Sandbox wrapper (srt contains a fake agent)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install srt and its Linux host deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat ripgrep
          # ubuntu-24.04 restricts unprivileged user namespaces; bwrap needs them (CI run 36757667416).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g --ignore-scripts @anthropic-ai/sandbox-runtime@0.0.78
          echo "PROBE srt: $(command -v srt) $(srt --version)"

      - name: Probe srt on an arbitrary argv command
        run: |
          settings="$RUNNER_TEMP/srt-probe.json"
          echo '{"network":{"allowedDomains":[],"deniedDomains":[]},"filesystem":{"denyRead":[],"allowRead":[],"allowWrite":[],"denyWrite":[]}}' > "$settings"
          out=$(srt --settings "$settings" -- node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "a b" 'c;d')
          echo "PROBE argv through srt: $out"
          test "$out" = '["a b","c;d"]'
          if srt --settings "$settings" -- sh -c "echo x > '$RUNNER_TEMP/outside'" 2>/dev/null; then
            echo "PROBE RESULT: srt did NOT block a write outside allowWrite"; exit 1
          fi
          if srt --settings "$settings" -- curl -sS --max-time 5 -o /dev/null https://example.com 2>/dev/null; then
            echo "PROBE RESULT: srt did NOT block a non-allowlisted host"; exit 1
          fi
          echo "PROBE RESULT: srt wraps an arbitrary argv command (argv intact, write and egress blocked)"

      - run: npm ci

      # The wrapped + tool bridge cases (#439) start the shipped shim, `dist/cli/main.js tool-bridge`.
      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Wrapped fake-agent specs, incl. pi and ACP wrapped + tool bridge (wrapper required)
        working-directory: packages/core
        env:
          SWENY_REQUIRE_SANDBOX_WRAPPER: "1"
        run: npx vitest run src/harness/sandbox

  # The composite Action on a clean runner with a non-Claude agent, in setup-only
  # mode (no model call): proves the pinned Codex and srt install, srt probes, and
  # the CLI loads and validates a workflow.
  action-codex-setup:
    name: Action setup (agent codex, no model call)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./
        with:
          workflow: examples/monitor.yml
          agent: codex
          openai-api-key: ci-not-a-real-key
          setup-only: "true"

      - name: Installed what the Action promised
        run: |
          echo "codex: $(codex --version)"
          codex --version | grep -F "$(grep -o 'TESTED_CODEX_VERSION = "[0-9.]*"' packages/core/src/harness/codex.ts | grep -o '[0-9][0-9.]*')"
          echo "srt: $(srt --version)"
          command -v rg
          srt_settings="$RUNNER_TEMP/srt-check.json"
          echo '{"network":{"allowedDomains":[],"deniedDomains":[]},"filesystem":{"denyRead":[],"allowRead":[],"allowWrite":[],"denyWrite":[]}}' > "$srt_settings"
          srt --settings "$srt_settings" -- true
          sweny workflow validate examples/monitor.yml

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: zizmor
        run: |
          pipx run zizmor==1.30.1 --min-severity high .github/workflows

  quickstart:
    name: Quickstart — README runs in a clean container
    runs-on: ubuntu-latest
    container: node:22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      # Packs core, installs the tarball into an empty prefix with a scrubbed
      # env (no credentials, no LLM calls) and runs the README quickstart,
      # including `sweny try` (asserts banner, answer block, receipt line, exit 0).
      - name: Run README quickstart
        env:
          DEMO_SVG_OUT: demo-actual.svg
        run: sh scripts/quickstart-smoke.sh

      # The freshly recorded demo, whether or not the committed copy matched:
      # when assets/demo.svg is stale, download this and commit it as assets/demo.svg.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: demo-svg
          path: demo-actual.svg
          if-no-files-found: ignore

  # Social cards (og-image, twitter-card, github-social) regenerated from the
  # brand SVGs and the tagline in core's theme. Generated here, never locally;
  # download the artifact and commit the PNGs when the tagline or brand changes.
  brand-assets:
    name: Brand assets (social cards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/core

      - name: Generate brand PNGs
        run: node scripts/generate-brand-pngs.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: social-cards
          path: |
            packages/web/public/og-image.png
            packages/web/public/twitter-card.png
            packages/web/public/github-social.png
          if-no-files-found: error

  docs-sites:
    name: Docs and specification builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            spec/package-lock.json

      - run: npm ci
      - run: npm ci --prefix spec

      # Match the docs Vercel build, including the Studio library consumed by it.
      - run: npm run build --workspace=packages/core
      - run: npm run build:lib --workspace=packages/studio
      - run: npm run build --workspace=packages/web

      # spec is deliberately outside the root workspaces and has its own lock.
      - run: npm run build --prefix spec

      # Assert neither built site loads a script from a third-party origin.
      - run: npx vitest run src/__tests__/no-third-party-scripts.test.ts
        working-directory: packages/web

  # Studio build plus before/after screenshots of the static app (PR #480).
  # Playwright runs here in CI only; the artifact holds the PNGs.
  studio-screenshots:
    name: Studio build and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/core

      - name: Build Studio (this commit)
        run: |
          npm run build --workspace=packages/studio
          cp -r packages/studio/dist "$RUNNER_TEMP/studio-after"

      - name: Build Studio (base branch, for the before shots)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git checkout "origin/$BASE_REF" -- packages/studio/src packages/studio/index.html
          git clean -fdq packages/studio/src
          npx --workspace=packages/studio vite build
          cp -r packages/studio/dist "$RUNNER_TEMP/studio-before"

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        env:
          PW_DIR: ${{ runner.temp }}/pw
        run: |
          node scripts/studio-screenshots.mjs "$RUNNER_TEMP/studio-after" studio-screenshots after
          if [ -d "$RUNNER_TEMP/studio-before" ]; then
            node scripts/studio-screenshots.mjs "$RUNNER_TEMP/studio-before" studio-screenshots before
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-screenshots
          path: studio-screenshots/*.png
          if-no-files-found: error
