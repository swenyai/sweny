name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: build + test must pass before we publish OR move the v5 action tag.
  # Kept as its own job so a publish-credential failure (which is NOT a code
  # failure) does not block the v5 tag from advancing, and so tag-action can
  # tell "code is good" from "publish failed".
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      # The exact commit this run built and tested. Everything downstream
      # (publish, tag-action) must act on this SHA, never on a newer main.
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record verified commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          npm run build --workspace=packages/core
          npm run build:lib --workspace=packages/studio
          npm run build --workspace=packages/mcp
      - name: Test
        run: npm run test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      id-token: write
      issues: write
    outputs:
      # Commit the version-only writeback pushed to main, if any.
      writeback_sha: ${{ steps.release.outputs.writeback_sha }}
      # @sweny-ai/core version this run published, if it published core.
      core_version: ${{ steps.release.outputs.core_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Assert publish builds the verified commit
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ] || { echo "::error::publish checkout is not the verified commit $VERIFIED_SHA"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Build
        run: |
          npm run build --workspace=packages/core
          npm run build:lib --workspace=packages/studio
          npm run build --workspace=packages/mcp

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changes and publish
        id: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'release-*' 2>/dev/null || echo "")
          DIFF_BASE=${LAST_TAG:-$(git rev-list --max-parents=0 HEAD)}

          CHANGED_CORE=$(node scripts/sync-release-versions.mjs changed "$DIFF_BASE" packages/core)
          CHANGED_STUDIO=$(node scripts/sync-release-versions.mjs changed "$DIFF_BASE" packages/studio)
          CHANGED_MCP=$(node scripts/sync-release-versions.mjs changed "$DIFF_BASE" packages/mcp)

          PUBLISHED=false
          SWENY_RELEASE_MANIFEST="$RUNNER_TEMP/sweny-published-versions.json"
          printf '{}' > "$SWENY_RELEASE_MANIFEST"

          # Version selection:
          #  - local strictly ahead of npm  -> publish LOCAL as-is (honors a
          #    deliberate minor/major bump set in package.json).
          #  - local behind-or-equal to npm -> cut npm+1 patch. This is the
          #    stale/already-taken case and also the race where a prior Release
          #    run published to npm but its post-publish git push lost to a
          #    concurrent merge, leaving main's package.json behind npm. Without
          #    it the next run would retry an already-published version and 403.
          bump_and_publish() {
            local pkg_dir="$1"
            local pkg_name="$2"
            cd "$pkg_dir"
            local LOCAL_VER NPM_VER HIGHER NEXT
            LOCAL_VER=$(node -p "require('./package.json').version")
            NPM_VER=$(npm view "$pkg_name" version 2>/dev/null || echo "0.0.0")
            HIGHER=$(printf '%s\n%s\n' "$LOCAL_VER" "$NPM_VER" | sort -V | tail -1)
            if [ "$LOCAL_VER" = "$HIGHER" ] && [ "$LOCAL_VER" != "$NPM_VER" ]; then
              # local > npm: a deliberate version; publish exactly what is set.
              echo "Publishing local version $LOCAL_VER for $pkg_name (ahead of npm $NPM_VER)"
            else
              # local <= npm: stale/taken; cut npm+1 patch so we never 403 a
              # version already on the registry nor republish a behind version.
              NEXT=$(echo "$NPM_VER" | awk -F. '{$NF=$NF+1; print}' OFS=.)
              npm version "$NEXT" --no-git-tag-version
            fi
            # Surface which package failed (the failure alert links the run, but
            # the annotation names the package). bash runs with -eo pipefail, so
            # a bare failure would still abort; this just makes it legible.
            npm publish --provenance || { echo "::error::npm publish failed for $pkg_name@$(node -p "require('./package.json').version")"; return 1; }
            echo "Published $pkg_name@$(node -p "require('./package.json').version")"
            node "$GITHUB_WORKSPACE/scripts/sync-release-versions.mjs" record "$SWENY_RELEASE_MANIFEST" "$pkg_dir" "$LOCAL_VER" "$(node -p "require('./package.json').version")" "$NPM_VER"
            cd - > /dev/null
          }

          if [ "$CHANGED_CORE" = true ]; then
            bump_and_publish packages/core "@sweny-ai/core"
            PUBLISHED=true
          fi

          if [ "$CHANGED_STUDIO" = true ]; then
            bump_and_publish packages/studio "@sweny-ai/studio"
            PUBLISHED=true
          fi

          if [ "$CHANGED_MCP" = true ]; then
            bump_and_publish packages/mcp "@sweny-ai/mcp"
            PUBLISHED=true
          fi

          if [ "$PUBLISHED" = true ]; then
            WRITEBACK_FILE="$RUNNER_TEMP/writeback-sha"
            rm -f "$WRITEBACK_FILE"
            node scripts/sync-release-versions.mjs sync "$SWENY_RELEASE_MANIFEST" "$WRITEBACK_FILE"
            if [ -s "$WRITEBACK_FILE" ]; then
              echo "writeback_sha=$(cat "$WRITEBACK_FILE")" >> "$GITHUB_OUTPUT"
            fi
            CORE_PUBLISHED=$(node -p "require(process.argv[1])['packages/core']?.published ?? ''" "$SWENY_RELEASE_MANIFEST")
            echo "core_version=$CORE_PUBLISHED" >> "$GITHUB_OUTPUT"
          fi

      - name: Advance release-latest diff base
        # release-latest is the diff base for change detection on the next run,
        # so it MUST only move on a successful publish (default if: success()).
        # If publish failed, the base stays put and the next run still sees the
        # unpublished changes.
        run: |
          # Point at the source that was built/published, not the newer main
          # used for version writeback. Concurrent merges still need publishing.
          git tag -f "release-latest" "${{ github.sha }}"
          git push origin "release-latest" --force

      - name: Alert on release failure
        # The publish failure that motivated this job split went unnoticed for
        # two weeks because nothing alerted. Open (or comment on) a GitHub issue
        # so it is visible. No external secret required.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TITLE="Release workflow failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Release job failed for commit ${{ github.sha }}. Run: ${RUN_URL}. Inspect the failed step: package publishing and Git version writeback are separate operations; a writeback failure can occur after npm publication succeeds."
          NUM=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  tag-action:
    name: Tag v5 action pointer
    runs-on: ubuntu-latest
    # Runs after publish for ordering, but advances the v5 tag whether or not
    # publish succeeded; the composite action.yml is independent of the npm
    # publish. Skipped only if the build/test gate failed or the run was
    # cancelled. This is what keeps a publish-credential blip from freezing
    # every swenyai/sweny@v5 consumer.
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    permissions:
      contents: write
    steps:
      # Check out exactly the commit verify tested, never the moving main. A
      # commit that landed while this run was in flight is unverified and must
      # not be stamped or tagged here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Resolve tag source
        id: source
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
          WRITEBACK_SHA: ${{ needs.publish.outputs.writeback_sha }}
        run: |
          # The tag source is the verified commit, or the publish version
          # writeback commit when it descends from it through version-only
          # commits (scripts/verify-tag-source.mjs). Anything else, such as an
          # unverified commit that landed in between, is ignored.
          BASE="$VERIFIED_SHA"
          if [ -n "$WRITEBACK_SHA" ]; then
            if node scripts/verify-tag-source.mjs "$VERIFIED_SHA" "$WRITEBACK_SHA"; then
              BASE="$WRITEBACK_SHA"
              git checkout --detach "$BASE"
            else
              echo "::warning::writeback $WRITEBACK_SHA is not a version-only descendant of $VERIFIED_SHA; tagging the verified commit"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Tag v5 moving tag and immutable v5.<core-version>
        env:
          BASE_SHA: ${{ steps.source.outputs.base }}
          PUBLISHED_CORE_VERSION: ${{ needs.publish.outputs.core_version }}
        run: |
          # The root action.yml is a composite action, no JS bundle to build.
          # Move the v5 tag to the verified commit (never newer main) so
          # consumers pinned to swenyai/sweny@v5 get the engine wrapper that
          # passed verify, and cut an immutable v5.<core_version> for anyone
          # who wants to pin precisely.
          [ "$(git rev-parse HEAD)" = "$BASE_SHA" ] || { echo "::error::checkout is not $BASE_SHA"; exit 1; }
          git tag -f v5 "$BASE_SHA"
          git push origin v5 --force

          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ -n "$PUBLISHED_CORE_VERSION" ] && [ "$PUBLISHED_CORE_VERSION" != "$CORE_VERSION" ]; then
            echo "::warning::published core $PUBLISHED_CORE_VERSION is not in the verified tree ($CORE_VERSION); not cutting an immutable tag"
            exit 0
          fi
          VERSIONED_TAG="v5.${CORE_VERSION}"
          # Only cut the immutable tag if it does not already exist (it will
          # when publish was skipped/failed and core's version is unchanged).
          if git rev-parse -q --verify "refs/tags/$VERSIONED_TAG" >/dev/null; then
            echo "$VERSIONED_TAG already exists, leaving it untouched"
          elif ! {
            # npm takes minutes to serve a just-published version. Poll the registry for this
            # exact version (15s, up to 15 min). A tag that pins a version npm does not serve
            # would break every consumer of it, so only skip after the timeout.
            for _ in $(seq 1 60); do
              served=$(curl -fsS "https://registry.npmjs.org/@sweny-ai%2fcore" | jq -r --arg v "$CORE_VERSION" '.versions[$v].version // empty' 2>/dev/null || true)
              [ "$served" = "$CORE_VERSION" ] && break
              sleep 15
            done
            [ "$served" = "$CORE_VERSION" ]
          }; then
            echo "::warning::@sweny-ai/core@${CORE_VERSION} not served by npm after 15 min; not cutting $VERSIONED_TAG"
          else
            # The immutable tag points at a commit (on no branch) whose action.yml defaults
            # cli-version to this exact core version, so re-running the tag runs the same code.
            # The floating v5 above is left alone and keeps defaulting to latest.
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            node scripts/stamp-action-version.mjs "$CORE_VERSION"
            git add action.yml
            git commit -m "chore(action): pin cli-version default to ${CORE_VERSION} for ${VERSIONED_TAG}"
            git tag "$VERSIONED_TAG"
            git push origin "$VERSIONED_TAG"
            echo "Pushed $VERSIONED_TAG (cli-version pinned to ${CORE_VERSION})"
          fi
