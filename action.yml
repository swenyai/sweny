name: "SWEny — Run AI Workflow"
description: "Run any SWEny workflow YAML on GitHub Actions. See also swenyai/triage and swenyai/e2e."
author: "SWEny"

branding:
  icon: "play"
  color: "orange"

inputs:
  workflow:
    description: "Path to the workflow YAML file to execute (relative to working-directory)."
    required: true

  claude-oauth-token:
    description: "Claude Code OAuth token. Use this OR anthropic-api-key. OAuth tokens do not consume API credit."
    required: false
  anthropic-api-key:
    description: "Anthropic API key for Claude (x-api-key). Use this OR claude-oauth-token."
    required: false
  anthropic-auth-token:
    description: "Bearer token (Authorization: Bearer) for gateways that expect it. Sets ANTHROPIC_AUTH_TOKEN. Distinct from anthropic-api-key (x-api-key)."
    required: false
  anthropic-base-url:
    description: "Anthropic-compatible base URL (e.g. a LiteLLM gateway). Sets ANTHROPIC_BASE_URL. See docs: Using a model gateway."
    required: false
  sweny-auth:
    description: "Auth mode: auto (default), api-key, or oauth. Set 'api-key' to authenticate a gateway with anthropic-api-key / anthropic-auth-token even when an OAuth token is also present."
    required: false
    default: "auto"

  cli-version:
    description: "Version of @sweny-ai/core to install (the package that ships the `sweny` CLI). Defaults to latest."
    required: false
    default: "latest"

  node-version:
    description: "Node.js version to install."
    required: false
    default: "24"

  working-directory:
    description: "Working directory to run the workflow from. Defaults to the repository root."
    required: false
    default: "."

  dry-run:
    description: "When 'true', run with read-only tools only: write tools, external MCP servers, and shell/file-edit tools are withheld, so nothing is created, posted, or sent. Stops at the first conditional edge."
    required: false
    default: "false"

  timeout:
    description: "Whole-run wall-clock budget in milliseconds, forwarded to `sweny workflow run --timeout`. Empty uses the CLI default (3600000 = 60 min). Use 0 for no wall-clock budget."
    required: false
    default: ""

  max-steps:
    description: "Hard cap on total node executions (including eval-failure retries), forwarded to `sweny workflow run --max-steps`. Empty uses the CLI default (200)."
    required: false
    default: ""

  verbose:
    description: "When 'true', print each tool call's input and output inline. Truncated for readability; use the CLI's --stream flag locally for full untruncated NDJSON. Helpful for debugging a node that halts or fails."
    required: false
    default: "false"

  input:
    description: |
      JSON object of per-run inputs for the workflow. Forwarded verbatim to
      `sweny workflow run --input '<json>'`. When the workflow declares an
      `inputs` block, the CLI validates this string against the declaration
      (type-check, required-field check, default-fill) and fails with a
      readable diff when the shape doesn't match. When the workflow does NOT
      declare `inputs`, the JSON is passed through unchanged for back-compat.

      Example (release-notes-style):
        input: |
          {
            "since_tag": "v1.41.12",
            "until_tag": "v1.41.13",
            "draft": true
          }
    required: false
    default: ""

  cloud-token:
    description: "Project token (sweny_pk_...) enabling opt-in run reporting. Optional, and not currently available. Token minting is not yet exposed, so leaving this unset (the default) means no outbound reporting request is made. Equivalent to setting the SWENY_CLOUD_TOKEN env var; either form is accepted."
    required: false

runs:
  using: "composite"
  steps:
    - name: Validate auth inputs
      shell: bash
      env:
        HAS_OAUTH: ${{ inputs.claude-oauth-token != '' }}
        HAS_API_KEY: ${{ inputs.anthropic-api-key != '' }}
        HAS_AUTH_TOKEN: ${{ inputs.anthropic-auth-token != '' }}
      run: |
        if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_API_KEY" != "true" ] && [ "$HAS_AUTH_TOKEN" != "true" ]; then
          echo "::error::Provide one of: claude-oauth-token, anthropic-api-key, or anthropic-auth-token"
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install SWEny CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: npm install -g "@sweny-ai/core@${CLI_VERSION}"

    # Agent sandbox deps (#360). SWENY_SANDBOX=auto (default) sandboxes agent
    # shell commands when bubblewrap + socat work and otherwise warns and runs
    # unsandboxed, so this step is best-effort and never fails the job.
    - name: Install agent sandbox dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        SUDO=""
        if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo -n"; fi
        if ! command -v bwrap >/dev/null 2>&1 || ! command -v socat >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            if ! { $SUDO apt-get update -qq && $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat; } >/dev/null 2>&1; then
              echo "::warning title=SWEny agent sandbox::Could not install bubblewrap/socat with apt; agent commands will run unsandboxed (SWENY_SANDBOX=auto)."
            fi
          else
            echo "::notice title=SWEny agent sandbox::apt-get not found; install bubblewrap and socat to sandbox agent commands."
          fi
        fi
        # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor,
        # which bubblewrap needs. Only relax the host kernel setting when the
        # caller explicitly asked for SWENY_SANDBOX=strict.
        if command -v bwrap >/dev/null 2>&1 && ! bwrap --ro-bind / / --dev /dev --proc /proc true >/dev/null 2>&1; then
          if [ "${SWENY_SANDBOX:-}" = "strict" ]; then
            $SUDO sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          fi
        fi
        exit 0

    - name: Run workflow
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic-auth-token }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        SWENY_AUTH: ${{ inputs.sweny-auth }}
        WORKFLOW_PATH: ${{ inputs.workflow }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERBOSE: ${{ inputs.verbose }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MAX_STEPS: ${{ inputs.max-steps }}
        WORKFLOW_INPUT: ${{ inputs.input }}
        INPUT_CLOUD_TOKEN: ${{ inputs.cloud-token }}
      run: |
        # Forward the cloud token to the CLI. Prefer the explicit `cloud-token`
        # input; otherwise honor whatever the caller put on the step env as
        # SWENY_CLOUD_TOKEN. Never overwrite a non-empty inherited value with
        # an empty input.
        if [ -n "$INPUT_CLOUD_TOKEN" ]; then
          export SWENY_CLOUD_TOKEN="$INPUT_CLOUD_TOKEN"
        fi
        # Normalize boolean-ish inputs (true / TRUE / 1 / yes).
        normalize() {
          local v
          v=$(echo "${1:-false}" | tr '[:upper:]' '[:lower:]')
          case "$v" in true|1|yes) echo "true" ;; *) echo "false" ;; esac
        }
        DRY_NORM=$(normalize "$DRY_RUN")
        VERBOSE_NORM=$(normalize "$VERBOSE")

        FLAGS=()
        [ "$DRY_NORM" = "true" ] && FLAGS+=("--dry-run")
        [ "$VERBOSE_NORM" = "true" ] && FLAGS+=("--verbose")
        if [ -n "$INPUT_TIMEOUT" ]; then
          FLAGS+=("--timeout" "$INPUT_TIMEOUT")
        fi
        if [ -n "$INPUT_MAX_STEPS" ]; then
          FLAGS+=("--max-steps" "$INPUT_MAX_STEPS")
        fi
        # Forward per-run inputs verbatim. Pass through env to avoid shell
        # quoting issues with nested JSON; the CLI parses and validates the
        # string against the workflow's declared `inputs` block (if any) and
        # fails with a readable error when the shape doesn't match.
        if [ -n "$WORKFLOW_INPUT" ]; then
          FLAGS+=("--input" "$WORKFLOW_INPUT")
        fi

        sweny workflow run "$WORKFLOW_PATH" "${FLAGS[@]}"
