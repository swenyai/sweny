name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  # Interactive: responds to @claude mentions in PR/issue comments
  respond:
    if: >
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read

  # Auto-review: runs on every PR open and push
  review:
    if: github.event_name == 'pull_request' && github.actor != 'claude[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          use_sticky_comment: "true"
          claude_args: "--allowedTools 'Bash(gh pr comment:*)' --allowedTools 'Bash(gh pr review:*)' --allowedTools 'Bash(gh api:*)'"
          prompt: |
            Review this pull request. Provide a concise code review covering
            correctness, potential bugs, and suggestions for improvement.
            If CI checks failed, investigate the logs and explain what went wrong.
            You MUST post your review as a comment on this PR using `gh pr comment`.
