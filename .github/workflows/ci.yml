name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is the action default (action.yml node-version), so the version
        # most consumers run the action on is exercised in CI.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - run: npm run test

  package-audit:
    name: Core package exports and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      # Both audits inspect the same publishable artifact, including only files
      # npm would ship. Checking the workspace can hide missing packed files.
      - name: Pack core
        run: |
          mkdir "$RUNNER_TEMP/core-package-audit"
          npm pack --workspace=packages/core --pack-destination "$RUNNER_TEMP/core-package-audit"

      - name: Check published exports
        run: npx --yes publint@0.3.24 --strict "$RUNNER_TEMP/core-package-audit/"*.tgz

      # Core is ESM-only; require Node ESM and bundler resolution, not require().
      # Keep automatic entrypoint discovery so new exports join the audit.
      - name: Check published TypeScript declarations
        run: npx --yes @arethetypeswrong/cli@0.18.5 --profile esm-only "$RUNNER_TEMP/core-package-audit/"*.tgz

  smoke-test:
    name: Smoke — core loads without optional deps
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Verify core loads
        run: |
          node --input-type=module <<'EOF'
          import('./packages/core/dist/index.js')
            .then(() => { console.log('✓ @sweny-ai/core loads'); })
            .catch((err) => { console.error('✗', err.message); process.exit(1); });
          EOF

  schema-drift:
    name: Schema — published JSON Schema matches generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build core (writes spec/public/schemas/workflow.json)
        run: npm run build --workspace=packages/core

      - name: Assert no diff between checked-in schema and generated output
        run: npm run check:schema-drift --workspace=packages/core

  # Evidence for #360: does SWENY_SANDBOX=auto actually sandbox on a
  # GitHub-hosted runner? Non-required; always green, the log is the result.
  sandbox-probe:
    name: Sandbox probe (bubblewrap on hosted runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install bubblewrap and socat
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat
          echo "PROBE bwrap: $(command -v bwrap) $(bwrap --version 2>&1 || true)"
          echo "PROBE socat: $(command -v socat)"
          echo "PROBE os: $(. /etc/os-release && echo "$PRETTY_NAME"), kernel $(uname -r)"
          echo "PROBE apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"

      - name: Probe bwrap
        run: |
          probe() { bwrap --ro-bind / / --dev /dev --proc /proc true 2>&1; }
          if out=$(probe); then
            echo "PROBE RESULT: bwrap works as-is (auto sandboxes on hosted runners)"
            exit 0
          fi
          echo "PROBE first attempt failed: $out"
          if echo "$out" | grep -qiE "user namespace|uid map|setting up uid|Operation not permitted|Permission denied"; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            if out2=$(probe); then
              echo "PROBE RESULT: bwrap works only after sysctl kernel.apparmor_restrict_unprivileged_userns=0"
            else
              echo "PROBE RESULT: bwrap still fails after sysctl: $out2"
            fi
          else
            echo "PROBE RESULT: bwrap fails for a non-userns reason"
          fi

  # #360 step 2: the harness-agnostic process wrapper (harness/sandbox-wrapper.ts)
  # runs any agent process under @anthropic-ai/sandbox-runtime (srt). This job
  # gives the hosted runner what srt needs, probes that srt wraps an arbitrary
  # argv command, then runs the wrapped fake-agent specs with the wrapper
  # REQUIRED (they fail instead of skipping when it is unavailable).
  sandbox-wrapper:
    name: Sandbox wrapper (srt contains a fake agent)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install srt and its Linux host deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat ripgrep
          # ubuntu-24.04 restricts unprivileged user namespaces; bwrap needs them (CI run 36757667416).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g --ignore-scripts @anthropic-ai/sandbox-runtime@0.0.78
          echo "PROBE srt: $(command -v srt) $(srt --version)"

      - name: Probe srt on an arbitrary argv command
        run: |
          settings="$RUNNER_TEMP/srt-probe.json"
          echo '{"network":{"allowedDomains":[],"deniedDomains":[]},"filesystem":{"denyRead":[],"allowRead":[],"allowWrite":[],"denyWrite":[]}}' > "$settings"
          out=$(srt --settings "$settings" -- node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "a b" 'c;d')
          echo "PROBE argv through srt: $out"
          test "$out" = '["a b","c;d"]'
          if srt --settings "$settings" -- sh -c "echo x > '$RUNNER_TEMP/outside'" 2>/dev/null; then
            echo "PROBE RESULT: srt did NOT block a write outside allowWrite"; exit 1
          fi
          if srt --settings "$settings" -- curl -sS --max-time 5 -o /dev/null https://example.com 2>/dev/null; then
            echo "PROBE RESULT: srt did NOT block a non-allowlisted host"; exit 1
          fi
          echo "PROBE RESULT: srt wraps an arbitrary argv command (argv intact, write and egress blocked)"

      - run: npm ci

      # The wrapped + tool bridge cases (#439) start the shipped shim, `dist/cli/main.js tool-bridge`.
      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Wrapped fake-agent specs, incl. pi wrapped + tool bridge (wrapper required)
        working-directory: packages/core
        env:
          SWENY_REQUIRE_SANDBOX_WRAPPER: "1"
        run: npx vitest run src/harness/sandbox

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: zizmor
        run: |
          pipx run zizmor==1.30.1 --min-severity high .github/workflows

  quickstart:
    name: Quickstart — README runs in a clean container
    runs-on: ubuntu-latest
    container: node:22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      # Packs core, installs the tarball into an empty prefix with a scrubbed
      # env (no credentials, no LLM calls) and runs the README quickstart.
      - name: Run README quickstart
        run: sh scripts/quickstart-smoke.sh
