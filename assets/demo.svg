<text class="t" x="401" y="23" text-anchor="middle">sweny try</text>
<text class="r k0" x="24" y="69"><tspan class="c0">$ </tspan><tspan class="b">sweny try</tspan></text>
<text class="r k1" x="24" y="88">  <tspan class="c1">▲</tspan> <tspan class="b">SWEny</tspan>  Workflows for coding agents. One set of rules, a receipt for every run.</text>
<text class="r k2" x="24" y="107"><tspan class="c0">  Recorded demo of explain-repo on a sample repo (acme-notes-api), illustrative data. No agent,</tspan></text>
<text class="r k2" x="24" y="126">    <tspan class="c0">network or credentials.</tspan></text>
<text class="r k3" x="24" y="145"></text>
<text class="r k4 sp" x="24" y="164">  <tspan class="c1">⠸</tspan> survey</text>
<text class="r k5" x="24" y="164">  <tspan class="c2">✓</tspan> survey   <tspan class="c0">18s · 12 tool calls</tspan></text>
<text class="r k6 sp" x="24" y="183">  <tspan class="c1">⠸</tspan> explain</text>
<text class="r k7" x="24" y="183">  <tspan class="c2">✓</tspan> explain  <tspan class="c0">9s</tspan></text>
<text class="r k8" x="24" y="202"></text>
<text class="r k9" x="24" y="221">  What it is: A small REST API for storing and searching notes, built with Express and</text>
<text class="r k9" x="24" y="240">    TypeScript on top of SQLite. Meant as the backend for a notes app.</text>
<text class="r k10" x="24" y="259">  How to run it:</text>
<text class="r k11" x="24" y="278">  - npm install</text>
<text class="r k12" x="24" y="297">  - npm run build</text>
<text class="r k13" x="24" y="316">  - npm test</text>
<text class="r k14" x="24" y="335">  - npm start (serves on http://localhost:3000)</text>
<text class="r k15" x="24" y="354">  Key files:</text>
<text class="r k16" x="24" y="373">  - src/server.ts: the entry point, wires routes and the database</text>
<text class="r k17" x="24" y="392">  - src/routes/notes.ts: the CRUD and search endpoints</text>
<text class="r k18" x="24" y="411">  - src/db/schema.sql: the tables, applied on first start</text>
<text class="r k19" x="24" y="430">  - test/notes.test.ts: the API tests, a good map of expected behavior</text>
<text class="r k20" x="24" y="449">  Watch out for:</text>
<text class="r k21" x="24" y="468">  - No auth on any route: fine locally, not safe to expose as is.</text>
<text class="r k22" x="24" y="487">  - The README does not mention the PORT or DB_PATH environment variables that src/server.ts</text>
<text class="r k22" x="24" y="506">    reads.</text>
<text class="r k23" x="24" y="525"></text>
<text class="r k24" x="24" y="544">  <tspan class="c0">On a pull request, CI posts this heading, this DAG and the receipt below:</tspan></text>
<text class="r k25" x="24" y="563"></text>
<text class="r k26" x="24" y="582">    <tspan class="c2">✓</tspan> <tspan class="b">Explain This Repo</tspan></text>
<text class="r k27" x="24" y="601"></text>
<text class="r k28" x="24" y="620">    ┌────────────────────┐</text>
<text class="r k29" x="24" y="639">    │ <tspan class="c2">✓</tspan> Survey the Repo  │</text>
<text class="r k30" x="24" y="658">    └──────────┬─────────┘</text>
<text class="r k31" x="24" y="677">               │</text>
<text class="r k32" x="24" y="696">    ┌──────────▼─────────┐</text>
<text class="r k33" x="24" y="715">    │ <tspan class="c2">✓</tspan> Explain It       │</text>
<text class="r k34" x="24" y="734">    └────────────────────┘</text>
<text class="r k35" x="24" y="753"></text>
<text class="r k36" x="24" y="772">  <tspan class="c0">╭┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄╮</tspan></text>
<text class="r k37" x="24" y="791">  <tspan class="c0">┆</tspan> <tspan class="c2 b">✓ passed</tspan>                            <tspan class="c0">run demo</tspan> <tspan class="c0">┆</tspan></text>
<text class="r k38" x="24" y="810">  <tspan class="c0">┆</tspan> explain-repo                                 <tspan class="c0">┆</tspan></text>
<text class="r k39" x="24" y="829">  <tspan class="c0">┆</tspan>                                              <tspan class="c0">┆</tspan></text>
<text class="r k40" x="24" y="848">  <tspan class="c0">┆</tspan> <tspan class="c0">nodes       </tspan>2/2                              <tspan class="c0">┆</tspan></text>
<text class="r k41" x="24" y="867">  <tspan class="c0">┆</tspan> <tspan class="c0">tool calls  </tspan>12                               <tspan class="c0">┆</tspan></text>
<text class="r k42" x="24" y="886">  <tspan class="c0">┆</tspan> <tspan class="c0">duration    </tspan>28s                              <tspan class="c0">┆</tspan></text>
<text class="r k43" x="24" y="905">  <tspan class="c0">┆</tspan> <tspan class="c0">tokens      </tspan>30k                              <tspan class="c0">┆</tspan></text>
<text class="r k44" x="24" y="924">  <tspan class="c0">┆</tspan> <tspan class="c0">cost        </tspan>$0.13                            <tspan class="c0">┆</tspan></text>
<text class="r k45" x="24" y="943">  <tspan class="c0">┆</tspan> <tspan class="c0">policy      </tspan>env scoped, sandbox on           <tspan class="c0">┆</tspan></text>
<text class="r k46" x="24" y="962">  <tspan class="c0">├╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌┤</tspan></text>
<text class="r k47" x="24" y="981">  <tspan class="c0">┆</tspan>          <tspan class="c1 b">[ ENV SCOPED · SANDBOXED ]</tspan>          <tspan class="c0">┆</tspan></text>
<text class="r k48" x="24" y="1000">  <tspan class="c0">╰┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄╯</tspan></text>
<text class="r k49" x="24" y="1019"></text>
<text class="r k50" x="24" y="1038">  <tspan class="c0">Run it on your repo:</tspan>  <tspan class="b">npx @sweny-ai/core new --template explain-repo</tspan></text>
</svg>
