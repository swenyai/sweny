# Status: Inactive — packages/worker and packages/shared are in aws-cloud, not this repo.
# Kept as reference for when managed execution is revisited.
name: Release Worker (inactive)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build worker
        run: npm run build --workspace=packages/worker

      - name: Generate standalone package-lock.json for Docker
        run: |
          # Build context is packages/worker/ — generate a lock file that resolves
          # @sweny-ai/* from the npm registry (not monorepo file: paths) so that
          # `npm ci --production` inside the Docker build works correctly.
          tmpdir=$(mktemp -d)
          cp packages/worker/package.json "$tmpdir/"
          cd "$tmpdir"
          npm install --package-lock-only --ignore-scripts
          cp package-lock.json "$GITHUB_WORKSPACE/packages/worker/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/swenyai/worker
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.title=sweny-worker
            org.opencontainers.image.description=SWEny open-source job executor
            org.opencontainers.image.source=https://github.com/swenyai/sweny
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/worker
          file: packages/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/swenyai/worker:${{ steps.sha.outputs.short }}
          output-file: worker-sbom.spdx.json
          format: spdx-json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: worker-${{ steps.sha.outputs.short }}
          name: worker-${{ steps.sha.outputs.short }}
          generate_release_notes: true
          files: worker-sbom.spdx.json
          body: |
            ## Docker image

            ```
            docker pull ghcr.io/swenyai/worker:${{ steps.sha.outputs.short }}
            ```

            **Digest:** `${{ steps.build.outputs.digest }}`

            **Platforms:** `linux/amd64`, `linux/arm64`

            ## Verify

            ```sh
            ./verify-build.sh ghcr.io/swenyai/worker:${{ steps.sha.outputs.short }} ${{ steps.sha.outputs.short }}
            ```
