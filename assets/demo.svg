<text class="t" x="401" y="23" text-anchor="middle">sweny try</text>
<text class="r k0" x="24" y="69" xml:space="preserve"><tspan x="24.00" class="c0">$</tspan><tspan x="39.70" class="b">sweny try</tspan></text>
<text class="r k1" x="24" y="88" xml:space="preserve"><tspan x="39.70" class="c1">▲</tspan><tspan x="55.40" class="b">SWEny</tspan><tspan x="110.35">Workflows for coding agents. One set of rules, a receipt for every run.</tspan></text>
<text class="r k2" x="24" y="107" xml:space="preserve"><tspan x="39.70" class="c0">Recorded demo of explain-repo on swenyai/sweny, a replay of a real run on 2026-11-10. No</tspan></text>
<text class="r k2" x="24" y="126" xml:space="preserve"><tspan x="55.40" class="c0">agent, network or credentials.</tspan></text>
<text class="r k3" x="24" y="145" xml:space="preserve"></text>
<text class="r k4 sp" x="24" y="164" xml:space="preserve"><tspan x="39.70" class="c1">⠸</tspan><tspan x="55.40">survey</tspan></text>
<text class="r k5" x="24" y="164" xml:space="preserve"><tspan x="39.70" class="c2">✓</tspan><tspan x="55.40">survey</tspan><tspan x="126.05" class="c0">16s · 2 tool calls</tspan></text>
<text class="r k6 sp" x="24" y="183" xml:space="preserve"><tspan x="39.70" class="c1">⠸</tspan><tspan x="55.40">explain</tspan></text>
<text class="r k7" x="24" y="183" xml:space="preserve"><tspan x="39.70" class="c2">✓</tspan><tspan x="55.40">explain</tspan><tspan x="126.05" class="c0">7s · 1 tool call</tspan></text>
<text class="r k8" x="24" y="202" xml:space="preserve"></text>
<text class="r k9" x="24" y="221" xml:space="preserve"><tspan x="39.70">What it is: SWEny runs DAGs of coding-agent steps (Claude Code, Codex, pi, ACP agents) defined</tspan></text>
<text class="r k9" x="24" y="240" xml:space="preserve"><tspan x="55.40">in YAML workflows, locally or in CI. It scopes each step's env and tools, validates output</tspan></text>
<text class="r k9" x="24" y="259" xml:space="preserve"><tspan x="55.40">schemas, and records a receipt per run. For teams automating coding-agent work.</tspan></text>
<text class="r k10" x="24" y="278" xml:space="preserve"><tspan x="39.70">How to run it (2 of 8):</tspan></text>
<text class="r k11" x="24" y="297" xml:space="preserve"><tspan x="39.70">- Use Node &gt;=22, then run: npm install (installs all workspaces)</tspan></text>
<text class="r k12" x="24" y="316" xml:space="preserve"><tspan x="39.70">- npm run build</tspan></text>
<text class="r k13" x="24" y="335" xml:space="preserve"><tspan x="39.70">Key files (2 of 10):</tspan></text>
<text class="r k14" x="24" y="354" xml:space="preserve"><tspan x="39.70">- README.md, ARCHITECTURE.md, CONTRIBUTING.md, CLAUDE.md: start here for the concepts and the</tspan></text>
<text class="r k14" x="24" y="373" xml:space="preserve"><tspan x="55.40">contributor rules</tspan></text>
<text class="r k15" x="24" y="392" xml:space="preserve"><tspan x="39.70">- packages/core/src/executor.ts: runs the DAG</tspan></text>
<text class="r k16" x="24" y="411" xml:space="preserve"><tspan x="39.70">Watch out for (2 of 5):</tspan></text>
<text class="r k17" x="24" y="430" xml:space="preserve"><tspan x="39.70">- Only Claude Code is fully supported. Codex, pi and ACP agents are experimental.</tspan></text>
<text class="r k18" x="24" y="449" xml:space="preserve"><tspan x="39.70">- Every push to main triggers release.yml, which publishes to npm, so merges ship straight</tspan></text>
<text class="r k18" x="24" y="468" xml:space="preserve"><tspan x="55.40">away. There are no changesets.</tspan></text>
<text class="r k19" x="24" y="487" xml:space="preserve"></text>
<text class="r k20" x="24" y="506" xml:space="preserve"><tspan x="39.70" class="c0">╭┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄╮</tspan></text>
<text class="r k21" x="24" y="525" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40" class="c2 b">✓ passed</tspan><tspan x="338.00" class="c0">run demo</tspan><tspan x="408.65" class="c0">┆</tspan></text>
<text class="r k22" x="24" y="544" xml:space="preserve"><tspan x="39.70" class="c0">┆</tspan><tspan x="55.40">explain-repo</tspan><tspan x="408.65" class="c0">┆</tspan></text>
