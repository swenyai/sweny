name: Release

# Do not re-run Release runs from before #529 merged: a re-run executes the
# workflow file of its original commit, whose tag-action force-moves v5 to that
# commit. Runs from after it reconcile to main and npm, so re-running them is safe.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: build + test must pass before we publish OR move the v5 action tag.
  # Kept as its own job so a publish-credential failure (which is NOT a code
  # failure) does not block the v5 tag from advancing, and so tag-action can
  # tell "code is good" from "publish failed".
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      # The exact commit this run built and tested. Everything downstream
      # (publish, tag-action) must act on this SHA, never on a newer main.
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record verified commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          npm run build --workspace=packages/core
          npm run build:lib --workspace=packages/studio
          npm run build --workspace=packages/mcp
      - name: Test
        run: npm run test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      id-token: write
      issues: write
    outputs:
      # @sweny-ai/core version this run published, if it published core.
      core_version: ${{ steps.release.outputs.core_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Assert publish builds the verified commit
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ] || { echo "::error::publish checkout is not the verified commit $VERIFIED_SHA"; exit 1; }

      - name: Publish only what main still carries
        id: gate
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          # main's tip must be this commit, or it plus version-only writebacks. A re-run of
          # an older commit would otherwise publish its old code under a new version and
          # write that version back to main.
          git fetch -q origin main
          if node scripts/verify-tag-source.mjs "$VERIFIED_SHA" FETCH_HEAD >/dev/null; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved past $VERIFIED_SHA; not publishing (its own release run does)"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Build
        run: |
          npm run build --workspace=packages/core
          npm run build:lib --workspace=packages/studio
          npm run build --workspace=packages/mcp

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changes and publish
        id: release
        if: steps.gate.outputs.current == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'release-*' 2>/dev/null || echo "")
          DIFF_BASE=${LAST_TAG:-$(git rev-list --max-parents=0 HEAD)}

          CHANGED_CORE=$(node scripts/sync-release-versions.mjs changed "$DIFF_BASE" packages/core)
          CHANGED_STUDIO=$(node scripts/sync-release-versions.mjs changed "$DIFF_BASE" packages/studio)
          CHANGED_MCP=$(node scripts/sync-release-versions.mjs changed "$DIFF_BASE" packages/mcp)

          PUBLISHED=false
          SWENY_RELEASE_MANIFEST="$RUNNER_TEMP/sweny-published-versions.json"
          printf '{}' > "$SWENY_RELEASE_MANIFEST"

          # Published packages that depend on core get the exact core this run
          # validated instead of the workspace range ("*" in studio), the way
          # pnpm rewrites workspace:* at publish. Only the published tarball
          # changes: the version writeback below carries version fields only.
          pin_core_dep() {
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (!pkg.dependencies?.["@sweny-ai/core"]) process.exit(0);
              pkg.dependencies["@sweny-ai/core"] = process.argv[1];
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            ' "$1"
          }

          # Version selection:
          #  - local strictly ahead of npm  -> publish LOCAL as-is (honors a
          #    deliberate minor/major bump set in package.json).
          #  - local behind-or-equal to npm -> cut npm+1 patch. This is the
          #    stale/already-taken case and also the race where a prior Release
          #    run published to npm but its post-publish git push lost to a
          #    concurrent merge, leaving main's package.json behind npm. Without
          #    it the next run would retry an already-published version and 403.
          bump_and_publish() {
            local pkg_dir="$1"
            local pkg_name="$2"
            cd "$pkg_dir"
            local LOCAL_VER NPM_VER HIGHER NEXT
            LOCAL_VER=$(node -p "require('./package.json').version")
            NPM_VER=$(npm view "$pkg_name" version 2>/dev/null || echo "0.0.0")
            HIGHER=$(printf '%s\n%s\n' "$LOCAL_VER" "$NPM_VER" | sort -V | tail -1)
            if [ "$LOCAL_VER" = "$HIGHER" ] && [ "$LOCAL_VER" != "$NPM_VER" ]; then
              # local > npm: a deliberate version; publish exactly what is set.
              echo "Publishing local version $LOCAL_VER for $pkg_name (ahead of npm $NPM_VER)"
            else
              # local <= npm: stale/taken; cut npm+1 patch so we never 403 a
              # version already on the registry nor republish a behind version.
              NEXT=$(echo "$NPM_VER" | awk -F. '{$NF=$NF+1; print}' OFS=.)
              npm version "$NEXT" --no-git-tag-version
            fi
            if [ "$pkg_name" != "@sweny-ai/core" ]; then pin_core_dep "$CORE_PIN"; fi
            # Surface which package failed (the failure alert links the run, but
            # the annotation names the package). bash runs with -eo pipefail, so
            # a bare failure would still abort; this just makes it legible.
            npm publish --provenance || { echo "::error::npm publish failed for $pkg_name@$(node -p "require('./package.json').version")"; return 1; }
            echo "Published $pkg_name@$(node -p "require('./package.json').version")"
            node "$GITHUB_WORKSPACE/scripts/sync-release-versions.mjs" record "$SWENY_RELEASE_MANIFEST" "$pkg_dir" "$LOCAL_VER" "$(node -p "require('./package.json').version")" "$NPM_VER"
            cd - > /dev/null
          }

          if [ "$CHANGED_CORE" = true ]; then
            bump_and_publish packages/core "@sweny-ai/core"
            PUBLISHED=true
            # Emit now, not after studio/mcp/writeback: tag-action must learn
            # about a core that reached npm even if a later step here fails.
            echo "core_version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"
            # Write core's version back now too, so main never lags what npm serves.
            node scripts/sync-release-versions.mjs sync "$SWENY_RELEASE_MANIFEST"
          fi

          # The core the dependents below are published against: this run's
          # publish, or the tree's core when core did not change (already on npm).
          CORE_PIN=$(node -p "require('./packages/core/package.json').version")
          if [ "$CHANGED_CORE" != true ] && { [ "$CHANGED_STUDIO" = true ] || [ "$CHANGED_MCP" = true ]; } \
            && [ "$(npm view "@sweny-ai/core@$CORE_PIN" version 2>/dev/null)" != "$CORE_PIN" ]; then
            echo "::error::@sweny-ai/core@$CORE_PIN is not on npm; refusing to publish packages pinned to it"
            exit 1
          fi

          if [ "$CHANGED_STUDIO" = true ]; then
            bump_and_publish packages/studio "@sweny-ai/studio"
            PUBLISHED=true
          fi

          if [ "$CHANGED_MCP" = true ]; then
            bump_and_publish packages/mcp "@sweny-ai/mcp"
            PUBLISHED=true
          fi

          if [ "$PUBLISHED" = true ]; then
            node scripts/sync-release-versions.mjs sync "$SWENY_RELEASE_MANIFEST"
          fi

      - name: Advance release-latest diff base
        # release-latest is the diff base for change detection on the next run,
        # so it MUST only move on a successful publish (an if: without a status
        # function implies success()). If publish failed or was gated off, the
        # base stays put and the next run still sees the unpublished changes.
        if: steps.gate.outputs.current == 'true'
        run: |
          # Point at the source that was built/published, not the newer main
          # used for version writeback. Concurrent merges still need publishing.
          git tag -f "release-latest" "${{ github.sha }}"
          git push origin "release-latest" --force

      - name: Alert on release failure
        # The publish failure that motivated this job split went unnoticed for
        # two weeks because nothing alerted. Open (or comment on) a GitHub issue
        # so it is visible. No external secret required.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TITLE="Release workflow failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Release job failed for commit ${{ github.sha }}. Run: ${RUN_URL}. Inspect the failed step: package publishing and Git version writeback are separate operations; a writeback failure can occur after npm publication succeeds."
          NUM=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  tag-action:
    name: Tag v5 action pointer
    runs-on: ubuntu-latest
    # Runs after publish for ordering, but whether or not publish succeeded:
    # it reconciles tags to main and npm, so a publish-credential blip never
    # freezes swenyai/sweny@v5. Skipped only if verify failed or the run was
    # cancelled.
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Tag v5 and immutable v5.<core-version> on a commit pinned to the tested core
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
          PUBLISHED_CORE_VERSION: ${{ needs.publish.outputs.core_version }}
        run: |
          # Desired-state reconciliation: converge to one state computed from origin/main
          # and npm:
          #   v5             main's tip with action.yml's cli-version stamped to the core
          #                  this run published (else main's core version), once npm
          #                  serves exactly that version
          #   v5.<version>   created at v5 when missing, never moved
          # The composite action.yml needs no build. main keeps "latest" for branch refs.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch -q --force --tags origin
          git fetch -q origin main

          # Only verified code reaches v5: main's tip must be the commit this run's verify
          # job tested, or it plus the publish job's version-only writeback (checked by the
          # verified tree's own script, before any of the tip's code runs). If main has
          # moved on, that commit's release run (same concurrency group) converges.
          # Forging a version-only commit to pass this needs push rights to main, which
          # branch protection gates.
          [ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ] || { echo "::error::checkout is not $VERIFIED_SHA"; exit 1; }
          if ! node scripts/verify-tag-source.mjs "$VERIFIED_SHA" FETCH_HEAD; then
            echo "::notice::main has moved past $VERIFIED_SHA; its own release run will reconcile v5"
            exit 0
          fi
          git checkout -q --detach FETCH_HEAD
          # The core this run published wins over main's version, which is stale when a
          # later publish step failed before the version writeback.
          PIN="${PUBLISHED_CORE_VERSION:-$(node -p "require('./packages/core/package.json').version")}"
          TAG="v5.${PIN}"

          # Floor: v5 never moves to a lower core than it pins (SemVer precedence, so a
          # prerelease ranks below its release). An equal core with a new action.yml moves.
          REGISTRY="https://registry.npmjs.org/@sweny-ai%2fcore"
          CUR=$({ git show v5:action.yml 2>/dev/null || true; } | sed -n '/^  cli-version:/,/^  [a-z]/s/^    default: "\([0-9][^"]*\)"$/\1/p' | sed -n 1p)
          if [ -z "$CUR" ]; then
            # Bootstrap: v5 pins no exact core yet (cli-version "latest", or no v5), so the
            # floor is npm's latest. Unreadable means unknown: leave v5.
            CUR=$(curl -fsS "$REGISTRY" | jq -r '."dist-tags".latest // empty' 2>/dev/null || true)
            [ -n "$CUR" ] || { echo "::notice::could not read npm's latest @sweny-ai/core; leaving v5"; exit 0; }
          fi
          if [ "$(node scripts/semver-compare.mjs "$PIN" "$CUR")" = "-1" ]; then
            echo "::notice::v5 pins @sweny-ai/core@${CUR}; not moving it down to ${PIN}"
            exit 0
          fi

          # npm takes minutes to serve a just-published version: poll every 15s for 15 min.
          # Still not served means nothing to do yet; the next release run converges.
          for i in $(seq 1 60); do
            served=$(curl -fsS "$REGISTRY" | jq -r --arg v "$PIN" '.versions[$v].version // empty' 2>/dev/null || true)
            if [ "$served" = "$PIN" ] || [ "$i" = 60 ]; then break; fi
            sleep 15
          done
          if [ "$served" != "$PIN" ]; then
            echo "::notice::@sweny-ai/core@${PIN} is not served by npm yet; leaving v5 for the next release run"
            exit 0
          fi

          node scripts/stamp-action-version.mjs "$PIN"
          git commit -q -am "chore(action): pin cli-version default to ${PIN}"
          if [ "$(git rev-parse -q --verify 'v5^{tree}' || true)" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "v5 already runs main's action.yml with core ${PIN}"
          else
            git tag -f v5 HEAD
            git push -q origin v5 --force
            echo "Moved v5 to $(git rev-parse HEAD) (cli-version pinned to ${PIN})"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "v5^{commit}"
            git push -q origin "$TAG"
            echo "Pushed $TAG"
          fi

      - name: Reconcile GitHub Releases for recent v5.* tags
        # Its own step so it runs whatever the tag step did, early exits included.
        if: always() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          # One Release per v5.* tag (they replace CHANGELOG.md), oldest first so each
          # one's notes start at the tag before it. Creating a missing one is also how a
          # failed create is repaired. Bounded to the 10 most recent tags (by creation):
          # repairs recent failures without backfilling the tags cut before Releases existed.
          git fetch -q --force --tags origin
          RELEASED=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          TAGS=$(git tag -l 'v5.*' --sort=creatordate | tail -n 11)
          NEWEST=$(printf '%s\n' "$TAGS" | tail -n 1)
          TOTAL=$(git tag -l 'v5.*' | wc -l)
          SKIP=$((TOTAL > 10 ? 1 : 0)) # the 11th newest only seeds the notes range
          PREV=""
          n=0
          for t in $TAGS; do
            n=$((n + 1))
            if [ "$n" -gt "$SKIP" ] && ! grep -qxF "$t" <<<"$RELEASED"; then
              NOTES=(--notes "First tracked v5 release.")
              if [ -n "$PREV" ]; then NOTES=(--generate-notes --notes-start-tag "$PREV"); fi
              LATEST=false
              if [ "$t" = "$NEWEST" ]; then LATEST=true; fi
              gh release create "$t" --verify-tag --title "$t" --latest="$LATEST" "${NOTES[@]}"
            fi
            PREV="$t"
          done
